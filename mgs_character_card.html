<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MGS Peace Walker - Character Card</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/dropzone/5.9.3/min/dropzone.min.css">
<style>
  :root {
    --bg-color: #b8b4a3;
    --red: #d81e05;
    --dark: #2b2b2b;
    --orange: #e8791a;
    --hatch: repeating-linear-gradient(
      45deg,
      #3a3a3a,
      #3a3a3a 4px,
      #b8b4a3 4px,
      #b8b4a3 10px
    );
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Courier New', Courier, monospace;
    background: #000;
    display: flex;
    justify-content: center;
    padding: 20px;
    min-height: 100vh;
  }

  .card {
    width: 1280px;
    max-width: 100%;
    aspect-ratio: 2560 / 1436;
    position: relative;
    background-color: var(--bg-color);
    background-image: url('background.png');
    background-size: cover;
    background-position: center;
    color: #1c1c1c;
    overflow: hidden;
    letter-spacing: 1px;
  }

  .grid {
    position: absolute;
    inset: 0;
    padding: 3.5% 3% 2% 2%;
    display: grid;
    grid-template-columns: 26% 1fr;
    grid-template-rows: auto auto 1fr;
    column-gap: 2%;
    row-gap: 1.5%;
  }

  /* ---------- PORTRAIT ---------- */
  .portrait-col {
    grid-row: 1 / 3;
    position: relative;
    display: flex;
    align-items: stretch;
  }

  .portrait {
    width: 100%;
    position: relative;
    background-color: #444;
    background-image: url('profile.png');
    background-size: cover;
    background-position: center center;
    filter: grayscale(100%) contrast(1.1);
  }

  .arrow {
    position: absolute;
    left: 8px;
    font-size: 2vw;
    color: #c94a3d;
    font-weight: bold;
  }
  .arrow.up { top: 6px; }
  .arrow.down { bottom: 6px; }

  /* ---------- HEADER / NAME ---------- */
  .header-col {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    gap: 0.3em;
  }

  .codename {
    font-size: 2.6em;
    font-weight: bold;
    letter-spacing: 3px;
    margin: 0;
  }

  .subtitle {
    font-size: 1.3em;
    margin: 0;
  }

  /* ---------- STATS (LIFE/PSYCHE + GMP) ---------- */
  .stats-row {
    display: flex;
    gap: 0.2em;
    align-items: stretch;
  }

  .stat-bars {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 0.2em;
  }

  .stat-bar {
    display: grid;
    position: relative;
    grid-template-columns: 215px 1fr;
    background: var(--dark);
    flex-grow: 1;
  }

  .stat-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    background: var(--red);
    transition: width 0.2s ease;
  }

  .stat-label {
    z-index: 1;
    color: #fff;
    font-weight: bold;
    font-size: 1.1em;
    display: flex;
    align-items: center;
    letter-spacing: 2px;
    margin-left: 1.2em;
  }

  .stat-value {
    z-index: 1;
    color: #fff;
    font-size: 1.3em;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 20px;
  }

  .gmp-box {
    background: var(--dark);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: center;
    padding: 4px 16px;
    padding-left: 5em;
  }

  .gmp-label {
    font-size: 0.9em;
    letter-spacing: 2px;
  }

  .gmp-value {
    font-size: 2.2em;
    font-weight: bold;
    line-height: 1;
  }

  /* ---------- PARAMETERS + SICKNESSES ROW ---------- */
  .params-and-sick {
    display: flex;
    flex-wrap: nowrap;
    gap: 1em;
  }

  .params-section {
    display: flex;
    flex-direction: column;
    gap: 0.4em;
    min-width: 0;
  }

  .section-title {
    font-size: 1.15em;
    font-weight: bold;
    color: #444;
    letter-spacing: 2px;
  }

  .params-row {
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    gap: 4px;
    height: 80px;
    overflow-x: auto;
  }

  .param-cell {
    background: var(--dark);
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    color: #fff;
    font-weight: bold;
    font-size: 1.2em;
    min-width: 2.4em;
    flex: 1 0 auto;
  }

  .param-fill {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    background: var(--red);
    transition: height 0.2s ease;
  }

  .param-icon {
    position: relative;
    z-index: 1;
    font-size: 1.6em;
    margin-bottom: 6px;
  }

  .param-grade {
    position: relative;
    z-index: 1;
    margin-bottom: 6px;
  }

  .param-cell.special .param-fill { background: var(--orange); }

  /* ---------- SICKNESSES PANEL ---------- */
  .sick-panel {
    display: flex;
    flex-direction: column;
    gap: 0.4em;
  }

  .sick-row {
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    gap: 4px;
    height: 80px;
  }

  .sick-cell {
    background: var(--hatch);
    border: 1px solid #555;
    width: 2.2em;
  }

  /* ---------- BOTTOM: SKILLS + QUOTE ---------- */
  .bottom-section {
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
    gap: 0.5em;
    min-height: 0;
  }

  .skills-title {
    font-size: 1.3em;
    font-weight: bold;
    color: #555;
    letter-spacing: 2px;
  }

  .skills-box {
    color: #fff;
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .skills-list {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    margin-bottom: 0.2em;
  }

  .skill-slot {
    background: rgba(58,58,58,0.92);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 20px;
    font-size: 1.15em;
    min-height: 48px;
  }

  .quote-box {
    background: rgba(58,58,58,0.92);
    flex: 1;
    padding: 20px 24px;
    font-size: 1.25em;
    line-height: 1.5;
    overflow: auto;
    white-space: pre-wrap;
  }

  /* ================= EDITOR UI ================= */

  .hamburger-btn {
    position: fixed;
    top: 24px;
    right: 24px;
    z-index: 1000;
    width: 52px;
    height: 52px;
    background: var(--dark);
    border: 2px solid var(--red);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    cursor: pointer;
    font-family: inherit;
  }
  .hamburger-btn span {
    display: block;
    width: 26px;
    height: 3px;
    background: #fff;
  }
  .hamburger-btn:hover { border-color: var(--orange); }
  .hamburger-btn:hover span { background: var(--orange); }

  .download-btn {
    position: fixed;
    top: 24px;
    right: 88px;
    z-index: 1000;
    width: 52px;
    height: 52px;
    background: var(--dark);
    border: 2px solid var(--red);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-family: inherit;
    font-size: 1.5em;
    line-height: 1;
  }
  .download-btn:hover { border-color: var(--orange); color: var(--orange); }
  .download-btn:disabled { opacity: 0.5; cursor: default; }

  .editor-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 1001;
  }

  .editor-dialog {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: 420px;
    max-width: 92vw;
    background: #1c1c1c;
    color: #eee;
    font-family: 'Courier New', Courier, monospace;
    box-shadow: -4px 0 24px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    z-index: 1002;
    border-left: 3px solid var(--red);
  }

  .editor-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    background: var(--dark);
    border-bottom: 2px solid var(--red);
  }

  .editor-header h2 {
    margin: 0;
    font-size: 1.1em;
    letter-spacing: 3px;
    color: #fff;
  }

  .editor-close {
    background: none;
    border: 1px solid #777;
    color: #fff;
    width: 30px;
    height: 30px;
    cursor: pointer;
    font-size: 1em;
    line-height: 1;
  }
  .editor-close:hover { border-color: var(--orange); color: var(--orange); }

  .editor-body {
    overflow-y: auto;
    padding: 18px 20px 40px;
    flex: 1;
  }

  .editor-section {
    margin-bottom: 24px;
    border-bottom: 1px solid #444;
    padding-bottom: 18px;
  }

  .editor-section h3 {
    margin: 0 0 10px;
    font-size: 0.85em;
    letter-spacing: 2px;
    color: var(--orange);
  }

  .field {
    margin-bottom: 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .field label {
    font-size: 0.75em;
    letter-spacing: 1px;
    color: #999;
  }

  .field input[type="text"],
  .field input[type="number"],
  .field textarea {
    background: #2b2b2b;
    border: 1px solid #555;
    color: #fff;
    padding: 6px 8px;
    font-family: inherit;
    font-size: 0.95em;
  }
  .field input:focus, .field textarea:focus {
    outline: none;
    border-color: var(--orange);
  }

  .field textarea {
    resize: vertical;
    min-height: 70px;
  }

  .subtitle-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .subtitle-row input { flex: 1; min-width: 0; }
  .subtitle-row .slash { color: #777; font-weight: bold; }

  .param-edit-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 8px;
    background: #262626;
    padding: 6px;
    border: 1px solid #3a3a3a;
  }
  .param-edit-row input[type="text"] {
    width: 44px;
    text-align: center;
    padding: 4px;
  }
  .param-edit-row input[type="number"] {
    width: 56px;
    padding: 4px;
  }
  .param-edit-row .grade-preview {
    width: 26px;
    text-align: center;
    font-weight: bold;
    color: var(--orange);
  }
  .param-edit-row label.special-lbl {
    font-size: 0.65em;
    color: #999;
    display: flex;
    align-items: center;
    gap: 3px;
  }
  .param-edit-row .remove-param {
    background: none;
    border: 1px solid #772222;
    color: #d88;
    width: 24px;
    height: 24px;
    cursor: pointer;
    line-height: 1;
    margin-left: auto;
  }
  .param-edit-row .remove-param:hover { border-color: var(--red); color: var(--red); }

  .add-param-btn {
    background: var(--dark);
    border: 1px dashed #666;
    color: #ccc;
    padding: 8px;
    width: 100%;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 1px;
  }
  .add-param-btn:hover { border-color: var(--orange); color: var(--orange); }

  #profile-dropzone.dropzone {
    border: 2px dashed #666;
    background: #262626;
    min-height: 120px;
    padding: 10px;
  }
  #profile-dropzone.dropzone .dz-message {
    color: #999;
    font-size: 0.9em;
    margin: 2em 0;
  }
  #profile-dropzone.dropzone:hover { border-color: var(--orange); }

  .current-photo-hint {
    font-size: 0.75em;
    color: #999;
    margin-bottom: 6px;
  }

  /* ---------- INLINE EDITABLE FIELDS (card contenteditable) ---------- */
  .editable-text {
    outline: none;
    cursor: text;
  }
  .editable-text:hover {
    box-shadow: 0 0 0 2px rgba(216, 30, 5, 0.4);
    background: rgba(216, 30, 5, 0.08);
  }
  .editable-text:focus {
    box-shadow: 0 0 0 2px var(--orange);
    background: rgba(232, 121, 26, 0.12);
  }
  .editable-text:empty::before {
    content: attr(data-placeholder);
    opacity: 0.4;
    pointer-events: none;
  }
  /* light-on-dark fields (skills, quote) get a lighter hover/focus tint */
  .skills-box .editable-text:hover,
  .quote-box.editable-text:hover {
    box-shadow: 0 0 0 2px rgba(232, 121, 26, 0.5);
    background: rgba(58, 58, 58, 0.5);
  }
  .skills-box .editable-text:focus,
  .quote-box.editable-text:focus {
    box-shadow: 0 0 0 2px var(--orange);
    background: rgba(58, 58, 58, 0.4);
  }
</style>
</head>
<body>

<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/dropzone/5.9.3/dropzone.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script type="module">
import van from 'https://cdn.jsdelivr.net/gh/vanjs-org/van/public/van-1.6.0.min.js';

Dropzone.autoDiscover = false;

const { div, span, button, input, textarea, h2, h3 } = van.tags;

// ---------- helpers ----------
function clamp(n, min, max) { return Math.min(max, Math.max(min, n)); }

function gradeFor(pct) {
  pct = Number(pct) || 0;
  if (pct >= 90) return 'S';
  if (pct >= 75) return 'A';
  if (pct >= 55) return 'B';
  if (pct >= 30) return 'C';
  if (pct >= 10) return 'D';
  return 'E';
}

function fourDigit(n) {
  n = clamp(Math.round(Number(n) || 0), 0, 9999);
  return String(n).padStart(4, '0');
}

function makeParam(icon, percent, special, specialGrade) {
  return {
    icon: van.state(icon),
    percent: van.state(percent),
    special: van.state(!!special),
    specialGrade: van.state(specialGrade || 'S'),
  };
}

// ---------- state ----------
const codename = van.state('CODENAME');
const clsPart = van.state('Class');
const rolePart = van.state('Role');
const genderPart = van.state('Gender');

const life = van.state(6100);
const psyche = van.state(8300);
const gmp = van.state(1500);

const profileImg = van.state(null);

const quote = van.state("Enter the character's quote or bio text here.");
const skills = [
  van.state('⭐ Skill Name'),
  van.state(''),
  van.state(''),
  van.state(''),
];

const paramsList = van.state([
  makeParam('⚔️', 20), // Combat
  makeParam('🔧', 35), // R&D
  makeParam('🍴', 20), // Mess Hall
  makeParam('💊', 20), // Medical
  makeParam('📊', 15), // Intel
  makeParam('🎯', 55), // Shoot
  makeParam('🔄', 10), // Reload
  makeParam('💣', 10), // Throw
  makeParam('⛓', 20), // Place
  makeParam('🚶', 100), // Walk
  makeParam('🏃', 20), // Run
  makeParam('✊', 10), // Fight
  makeParam('🛡️', 20), // Defense
  makeParam('🙌', 100, true, '⇈'), // Morale
  // 👮🏻‍♂️ brig (bars)
  // 🤒 sick (x-eyes)
  // 🤕 wounded (no idea)
  // 😵‍💫 PTSD (tear?)
  // ⬇️ Weakened (down arrow)
  // 🏴 OUTER OPS (flag)
]);

const dialogOpen = van.state(false);

// ---------- persistence (localStorage) ----------

const STORAGE_KEY = 'mgsCharacterCard:v1';

function collectSerializable() {
  return {
    version: 1,
    codename: codename.val,
    clsPart: clsPart.val,
    rolePart: rolePart.val,
    genderPart: genderPart.val,
    life: life.val,
    psyche: psyche.val,
    gmp: gmp.val,
    profileImg: profileImg.val,
    quote: quote.val,
    skills: skills.map(s => s.val),
    paramsList: paramsList.val.map(p => ({
      icon: p.icon.val,
      percent: p.percent.val,
      special: p.special.val,
      specialGrade: p.specialGrade.val,
    })),
  };
}

function loadSavedState() {
  let raw;
  try {
    raw = localStorage.getItem(STORAGE_KEY);
  } catch (err) {
    // Some browsers throw just for accessing localStorage (e.g. certain
    // private-browsing modes with storage disabled entirely).
    console.warn('localStorage is unavailable; entries will not be remembered between visits:', err);
    return;
  }
  if (!raw) return;

  let data;
  try {
    data = JSON.parse(raw);
  } catch (err) {
    console.warn('Saved character card data was corrupted; starting fresh:', err);
    return;
  }
  if (!data || typeof data !== 'object') return;

  if (typeof data.codename === 'string') codename.val = data.codename;
  if (typeof data.clsPart === 'string') clsPart.val = data.clsPart;
  if (typeof data.rolePart === 'string') rolePart.val = data.rolePart;
  if (typeof data.genderPart === 'string') genderPart.val = data.genderPart;
  if (typeof data.life === 'number') life.val = clamp(Math.round(data.life), 0, 9999);
  if (typeof data.psyche === 'number') psyche.val = clamp(Math.round(data.psyche), 0, 9999);
  if (typeof data.gmp === 'number') gmp.val = clamp(Math.round(data.gmp), 0, 999999);
  if (typeof data.profileImg === 'string') profileImg.val = data.profileImg;
  if (typeof data.quote === 'string') quote.val = data.quote;

  if (Array.isArray(data.skills)) {
    data.skills.forEach((val, i) => {
      if (skills[i] && typeof val === 'string') skills[i].val = val;
    });
  }

  if (Array.isArray(data.paramsList) && data.paramsList.length > 0) {
    paramsList.val = data.paramsList.map(p => makeParam(
      typeof p.icon === 'string' ? p.icon : '\u2753',
      clamp(Number(p.percent) || 0, 0, 100),
      !!p.special,
      typeof p.specialGrade === 'string' ? p.specialGrade : 'S',
    ));
  }
}

let saveTimer = null;
function persistNow() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(collectSerializable()));
  } catch (err) {
    // Most commonly a QuotaExceededError - the profile photo is stored
    // as a base64 data URL and can be large. We skip saving rather than
    // interrupting the user with an error.
    console.warn('Could not save character card to localStorage:', err);
  }
}
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persistNow, 300);
}

// Restore any previously-saved entries before the card is first built,
// so the initial render already reflects them.
loadSavedState();

// Auto-save whenever any persisted field changes. Reading every field
// here (via collectSerializable) is what registers them all as this
// derive's dependencies; the actual write happens after a short
// debounce so rapid typing doesn't hit localStorage on every keystroke.
// This has no DOM involvement at all, so it can't cause the
// focus-loss/rebuild issues we ran into elsewhere in this file.
van.derive(() => {
  collectSerializable();
  scheduleSave();
});

// ---------- card display ----------

function StatBar(labelText, valueState) {
  return div({ class: 'stat-bar' },
    div({ class: 'stat-fill', style: () => `width:${clamp(valueState.val / 9999 * 100, 0, 100)}%` }),
    div({ class: 'stat-label' }, labelText),
    div({ class: 'stat-value' }, () => fourDigit(valueState.val)),
  );
}

function ParamCell(p) {
  return div({ class: () => 'param-cell' + (p.special.val ? ' special' : '') },
    div({ class: 'param-fill', style: () => `height:${clamp(Number(p.percent.val) || 0, 0, 100)}%` }),
    span({ class: 'param-icon' }, () => p.icon.val),
    span({ class: 'param-grade' }, () => p.special.val ? p.specialGrade.val : gradeFor(p.percent.val)),
  );
}

function Card() {
  return div({ class: 'card' },
    div({ class: 'grid' },

      div({ class: 'portrait-col' },
        div({ class: 'portrait', style: () => profileImg.val ? `background-image:url(${profileImg.val})` : '' }),
      ),

      div({ class: 'header-col' },
        div({ class: 'codename' }, editableInline(span, codename)),
        div({ class: 'subtitle' },
          editableInline(span, clsPart),
          ' / ',
          editableInline(span, rolePart),
          ' / ',
          editableInline(span, genderPart),
        ),
        div({ class: 'stats-row' },
          div({ class: 'stat-bars' },
            StatBar('LIFE', life),
            StatBar('PSYCHE', psyche),
          ),
          div({ class: 'gmp-box' },
            div({ class: 'gmp-label' }, 'GMP+'),
            div({ class: 'gmp-value' }, () => gmp.val),
          ),
        ),
      ),

      div({ class: 'params-and-sick' },
        div({ class: 'params-section' },
          div({ class: 'section-title' }, '<PARAMETERS>'),
          div({ class: 'params-row' }, () => div({ style: 'display:contents' }, ...paramsList.val.map(p => ParamCell(p)))),
        ),
        div({ class: 'sick-panel' },
          div({ class: 'section-title' }, '<SICKNESSES>'),
          div({ class: 'sick-row' },
            div({ class: 'sick-cell' }), div({ class: 'sick-cell' }),
            div({ class: 'sick-cell' }), div({ class: 'sick-cell' }),
          ),
        ),
      ),

      div({ class: 'bottom-section' },
        div({ class: 'skills-title' }, '<SKILLS>'),
        div({ class: 'skills-box' },
          div({ class: 'skills-list' },
            ...skills.map((s, i) => div({ class: 'skill-slot' },
              editableInline(span, s, { placeholder: `Skill ${i + 1}` }))),
          ),
          editableMultiline(div, quote, { extraClass: 'quote-box' }),
        ),
      ),
    ),
  );
}

// ---------- editor dialog ----------

function Field(labelText, el) {
  return div({ class: 'field' }, div({}, labelText), el);
}

function numberInput(state, min, max) {
  const el = input({
    type: 'number', min, max, value: state.val,
    oninput: e => {
      const v = clamp(parseInt(e.target.value, 10) || 0, min, max);
      state.val = v;
    },
  });
  // Reflect changes made elsewhere (e.g. directly on the card via
  // contenteditable) - but only while this field isn't focused, so we
  // never fight the user mid-keystroke or reset the caret.
  van.derive(() => {
    const v = state.val;
    if (document.activeElement !== el && Number(el.value) !== v) el.value = v;
  });
  return el;
}

function textInput(state, placeholder) {
  const el = input({
    type: 'text', value: state.val, placeholder: placeholder || '',
    oninput: e => { state.val = e.target.value; },
  });
  van.derive(() => {
    const v = state.val;
    if (document.activeElement !== el && el.value !== v) el.value = v;
  });
  return el;
}

// ---------- inline contenteditable fields (direct editing on the card) ----------

function pastePlainText(e) {
  e.preventDefault();
  const text = (e.clipboardData || window.clipboardData).getData('text/plain');
  // execCommand is deprecated but remains the simplest cross-browser
  // way to insert plain text into a contenteditable at the caret
  // without pulling in a rich-text editing library.
  document.execCommand('insertText', false, text);
}

// Single-line editable field (codename, class/role/gender, skills):
// Enter confirms/blurs rather than inserting a line break, and pasted
// content is flattened to plain text on one line.
function editableInline(tagFn, state, opts = {}) {
  const { extraClass = '', placeholder = '' } = opts;
  const el = tagFn({
    class: `editable-text ${extraClass}`.trim(),
    contenteditable: 'true',
    spellcheck: 'false',
    'data-placeholder': placeholder,
    oninput: e => { state.val = e.currentTarget.textContent; },
    onkeydown: e => {
      if (e.key === 'Enter') { e.preventDefault(); e.currentTarget.blur(); }
    },
    onpaste: e => {
      pastePlainText(e);
      // insertText fires its own input event, but normalize afterwards
      // in case a newline slipped through (e.g. via IME/other paths).
      setTimeout(() => {
        const flat = el.textContent.replace(/[\r\n]+/g, ' ');
        if (flat !== el.textContent) el.textContent = flat;
        state.val = el.textContent;
      }, 0);
    },
  }, state.val);

  // Sync in external changes (from the sidebar dialog, or any other
  // consumer of this state) - but skip while this element has focus,
  // so we never overwrite text the user is actively typing and reset
  // their caret position.
  van.derive(() => {
    const v = state.val;
    if (document.activeElement !== el && el.textContent !== v) el.textContent = v;
  });

  return el;
}

// Multi-line editable field (quote/bio): Enter is allowed to insert a
// real line break, matching the textarea in the sidebar dialog.
function editableMultiline(tagFn, state, opts = {}) {
  const { extraClass = '' } = opts;
  const el = tagFn({
    class: `editable-text ${extraClass}`.trim(),
    contenteditable: 'true',
    spellcheck: 'false',
    oninput: e => { state.val = e.currentTarget.innerText; },
    onpaste: pastePlainText,
  }, state.val);

  van.derive(() => {
    const v = state.val;
    if (document.activeElement !== el && el.innerText !== v) el.innerText = v;
  });

  return el;
}

function ParamEditRow(p, onRemove) {
  return div({ class: 'param-edit-row' },
    input({
      type: 'text', value: p.icon.val, maxlength: 4,
      oninput: e => { p.icon.val = e.target.value; },
    }),
    input({
      type: 'number', min: 0, max: 100, value: p.percent.val,
      oninput: e => { p.percent.val = clamp(parseInt(e.target.value, 10) || 0, 0, 100); },
    }),
    span({ class: 'grade-preview' }, () => p.special.val ? '' : gradeFor(p.percent.val)),
    div({ style: 'display:flex;flex-direction:column;gap:2px;' },
      label({ class: 'special-lbl' },
        input({
          type: 'checkbox', checked: p.special.val,
          onchange: e => { p.special.val = e.target.checked; },
        }),
        'special',
      ),
      () => p.special.val ? input({
        type: 'text', value: p.specialGrade.val, maxlength: 3,
        style: 'width:36px;padding:2px;',
        oninput: e => { p.specialGrade.val = e.target.value; },
      }) : '',
    ),
    button({
      class: 'remove-param',
      onclick: onRemove,
    }, '\u2715'),
  );
}

// Builds and owns the list of parameter-editor rows imperatively
// (plain DOM add/remove on explicit user actions) instead of via a
// van reactive binding keyed on paramsList.val. A reactive binding
// here would re-run - rebuilding EVERY row's DOM node from scratch -
// on ANY field change in ANY row, because ParamEditRow() reads each
// row's icon/percent/special .val synchronously to set initial input
// values; those reads would get captured as dependencies of the same
// binding that maps over the whole list. That's exactly why typing a
// second digit into a parameter box required refocusing: the row
// (and its focused input) was being destroyed and recreated after
// every keystroke. Building rows once and only touching the DOM on
// add/remove avoids that entirely - normal typing never touches this
// container.
function ParamsEditorSection() {
  const rowsContainer = div({ style: 'display:contents' });
  const rowElByParam = new Map();

  function addRow(p) {
    const rowEl = ParamEditRow(p, () => {
      paramsList.val = paramsList.val.filter(item => item !== p);
      const el = rowElByParam.get(p);
      if (el) { el.remove(); rowElByParam.delete(p); }
    });
    rowElByParam.set(p, rowEl);
    van.add(rowsContainer, rowEl);
  }

  paramsList.val.forEach(addRow);

  return div({},
    rowsContainer,
    button({
      class: 'add-param-btn',
      onclick: () => {
        const p = makeParam('\u2753', 50);
        paramsList.val = [...paramsList.val, p];
        addRow(p);
      },
    }, '+ ADD PARAMETER'),
  );
}

// need "label" tag
const { label } = van.tags;

function setupDropzone(container) {
  const dz = new Dropzone(container, {
    url: '#',
    autoProcessQueue: false,
    maxFiles: 1,
    acceptedFiles: 'image/*',
    addRemoveLinks: true,
    dictDefaultMessage: 'Drop a profile photo here or click to upload',
  });
  dz.on('addedfile', file => {
    if (dz.files.length > 1) {
      dz.removeFile(dz.files[0]);
    }
    const reader = new FileReader();
    reader.onload = e => { profileImg.val = e.target.result; };
    reader.readAsDataURL(file);
  });
  dz.on('removedfile', () => {
    if (dz.files.length === 0) profileImg.val = null;
  });
  return dz;
}

function Dialog() {
  const dzContainer = div({ id: 'profile-dropzone', class: 'dropzone' });

  const dialogEl = div({ class: 'editor-dialog' },
    div({ class: 'editor-header' },
      h2({}, 'EDIT CARD'),
      button({ class: 'editor-close', onclick: () => { dialogOpen.val = false; } }, '\u2715'),
    ),
    div({ class: 'editor-body' },

      div({ class: 'editor-section' },
        h3({}, 'IDENTITY'),
        Field('Codename', textInput(codename)),
        div({ class: 'field' },
          div({}, 'Class / Role / Gender'),
          div({ class: 'subtitle-row' },
            textInput(clsPart),
            span({ class: 'slash' }, '/'),
            textInput(rolePart),
            span({ class: 'slash' }, '/'),
            textInput(genderPart),
          ),
        ),
      ),

      div({ class: 'editor-section' },
        h3({}, 'PHOTO'),
        div({ class: 'current-photo-hint' }, 'Upload a profile photo (used as the portrait image).'),
        dzContainer,
      ),

      div({ class: 'editor-section' },
        h3({}, 'STATS'),
        Field('Life (0-9999)', numberInput(life, 0, 9999)),
        Field('Psyche (0-9999)', numberInput(psyche, 0, 9999)),
        Field('GMP+', numberInput(gmp, 0, 999999)),
      ),

      div({ class: 'editor-section' },
        h3({}, 'PARAMETERS'),
        ParamsEditorSection(),
      ),

      div({ class: 'editor-section' },
        h3({}, 'SKILLS'),
        ...skills.map((s, i) => Field(`Skill ${i + 1}`, textInput(s))),
      ),

      div({ class: 'editor-section', style: 'border-bottom:none;margin-bottom:0;' },
        h3({}, 'QUOTE / BIO'),
        textarea({
          value: quote.val,
          oninput: e => { quote.val = e.target.value; },
        }),
      ),
    ),
  );

  // Attach dropzone after the element tree exists.
  setTimeout(() => setupDropzone(dzContainer), 0);

  return dialogEl;
}

// ---------- PNG export ----------

function safeFileName(name) {
  const cleaned = String(name || '').trim().replace(/[^a-z0-9_\- ]+/gi, '').trim().replace(/\s+/g, '_');
  return cleaned || 'card';
}

async function downloadCardPng(triggerBtn) {
  const cardEl = document.querySelector('.card');
  if (!cardEl || typeof html2canvas !== 'function') {
    console.error('html2canvas not available or .card not found');
    return;
  }
  if (triggerBtn) triggerBtn.disabled = true;
  try {
    const canvas = await html2canvas(cardEl, {
      backgroundColor: null,
      scale: 2,
      useCORS: true,
    });
    const dataUrl = canvas.toDataURL('image/png');
    const link = document.createElement('a');
    link.download = `${safeFileName(codename.val)}.png`;
    link.href = dataUrl;
    document.body.appendChild(link);
    link.click();
    link.remove();
  } catch (err) {
    console.error('Failed to export card as PNG:', err);
  } finally {
    if (triggerBtn) triggerBtn.disabled = false;
  }
}

function DownloadButton() {
  const btn = button({
    class: 'download-btn',
    'aria-label': 'Download card as PNG',
    title: 'Download card as PNG',
    onclick: (e) => downloadCardPng(e.currentTarget),
  }, '\u2913');
  return btn;
}

function EditorUI() {
  // Build the overlay + dialog exactly once. Toggling `dialogOpen`
  // must never recreate these nodes - Dialog() reads many fields'
  // .val synchronously while building the form (to set each input's
  // initial value), so if it were rebuilt inside a reactive binding
  // that also depends on those fields, every keystroke in any field
  // would tear down and rebuild the whole dialog, killing focus.
  // Instead we mount it once and only flip a `display` style, which
  // is a leaf-level binding depending on dialogOpen alone.
  const modalWrap = div(
    {
      class: 'editor-modal-wrap',
      style: () => dialogOpen.val ? '' : 'display:none;',
    },
    div({ class: 'editor-overlay', onclick: () => { dialogOpen.val = false; } }),
    Dialog(),
  );

  return div({},
    button({
      class: 'hamburger-btn',
      'aria-label': 'Edit card',
      onclick: () => { dialogOpen.val = true; },
    }, span({}), span({}), span({})),
    DownloadButton(),
    modalWrap,
  );
}

// ---------- mount ----------
// NOTE: Card() and EditorUI() are mounted as plain (already-built) DOM
// nodes, not as `() => Card()` / `() => EditorUI()` reactive wrappers.
// Both functions already do their fine-grained reactive binding
// internally (every dynamic bit is a nested `() => state.val` child or
// prop, which VanJS binds in isolation). Wrapping the whole call in a
// function here would instead make VanJS treat *every* van.state read
// anywhere during that single build as a dependency of the entire
// returned subtree - so e.g. typing into the codename field would
// destroy and recreate the whole editor dialog (and any focused
// input inside it) on every keystroke.
const app = document.getElementById('app');
van.add(app, Card());
van.add(app, EditorUI());
</script>

</body>
