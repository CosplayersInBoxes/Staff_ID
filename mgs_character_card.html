<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MGS Peace Walker - Character Card</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/dropzone/5.9.3/min/dropzone.min.css">
<style>
  :root {
    --bg-color: #b8b4a3;
    --red: #d81e05;
    --dark: #2b2b2b;
    --orange: #e8791a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Courier New', Courier, monospace;
    background: #000;
    display: flex;
    justify-content: center;
    padding: 20px;
    min-height: 100vh;
  }

  .paper {
    width: 1280px;
    max-width: 100%;
    aspect-ratio: 2560 / 1436;
    position: relative;
    background-color: var(--bg-color);
    background-image: url('Paper.svg');
    background-size: 100% 100%, cover;
  }

  /* Wraps .paper so the mobile-scaling script (applyMobileScale, near
     the bottom of this file) has a plain box to resize/collapse around
     without disturbing .paper's own CSS. It's a no-op on desktop -
     display:contents means it generates no box of its own, so .paper
     lays out exactly as if this wrapper didn't exist at all - and it
     only gets a real box once the script gives it one inline, below
     the mobile breakpoint. */
  .paper-scale-wrap {
    display: contents;
  }

  /* The card is a wide, landscape-shaped ID card - on a phone held
     upright there just isn't enough width to show it at a usable size
     even with the scaling above, so portrait phone users see this
     prompt instead of the (hidden) card until they rotate. Pure CSS,
     no JS: the media query alone shows/hides it live as the device
     rotates. Desktop and landscape phones/tablets never see it. */
  .rotate-prompt {
    display: none;
  }

  @media (max-width: 930px) and (orientation: portrait) {
    .rotate-prompt {
      display: flex;
      position: fixed;
      inset: 0;
      z-index: 3000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 32px;
      text-align: center;
      background: #000;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
    }
    .rotate-prompt .rotate-icon {
      font-size: 3em;
      line-height: 1;
      animation: rotate-hint 1.8s ease-in-out infinite;
    }
    .rotate-prompt .rotate-text {
      max-width: 26em;
      font-size: 1.1em;
      letter-spacing: 1px;
    }
    /* #app holds both the card and the editor UI (hamburger/download
       buttons, dialog) - all of it waits behind the prompt until the
       phone is rotated, rather than leaving controls tappable behind
       an overlay that only covers the card. */
    #app {
      display: none;
    }
  }

  @keyframes rotate-hint {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(90deg); }
  }

  @media (max-width: 930px) {
    /* Below this width, applyMobileScale() takes over sizing .paper
       via inline width/transform (see the script) rather than the
       max-width:100% rule above, so the card's internal layout never
       has to reflow into a too-narrow box - it renders at its normal
       1280px design width and is scaled down as a whole, exactly like
       zooming out, so every proportion stays identical to desktop.
       .paper-scale-wrap gets a real box here (overriding display:
       contents above) so it can be sized to match the shrunk card and
       avoid leaving blank space below it. */
    .paper-scale-wrap {
      display: block;
      margin: 0 auto;
    }

    /* iOS Safari auto-zooms the whole page when focusing a form field
       with a computed font-size under 16px, which is jarring and not
       something a desktop user would ever see. The editor dialog's
       fields are ~15px (0.95em) and hit this; LIFE/PSYCHE/GMP+'s
       on-card inputs are already well above 16px so they're left
       alone rather than resized out of proportion with their labels. */
    .field input[type="text"],
    .field input[type="number"],
    .field textarea {
      font-size: 16px;
    }
  }

  .card {
    position: relative;
    width: 100%;
    height: 100%;
    background-image: url('overlay.png');
    background-size: contain;
    background-position: right, center;
    background-repeat: no-repeat, no-repeat;
    color: #1c1c1c;
    overflow: hidden;
    letter-spacing: 1px;
  }

  .grid {
    position: absolute;
    inset: 0;
    /* Bottom padding is larger than the other 3 sides (2%/3%/3.5%
       elsewhere) specifically to reserve room for .ticker-tape, which
       is a sibling of .grid (not inside it) positioned absolutely
       along the very bottom edge of .card - without this, the ticker
       bar would sit on top of (and hide) the bottom of the quote box. */
    padding: 3.5% 3% 6% 2%;
    display: grid;
    grid-template-columns: 26% 1fr;
    grid-template-rows: auto auto 1fr;
    column-gap: 2%;
    row-gap: 1.5%;
  }

  /* ---------- TICKER TAPE ---------- */
  .ticker-tape {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 4%;
    background: #000;
    overflow: hidden;
    display: flex;
    align-items: center;
  }

  .ticker-track {
    display: inline-flex;
    white-space: nowrap;
    animation: ticker-scroll 64s linear infinite;
    will-change: transform;
  }

  .ticker-segment {
    display: inline-block;
    padding-right: 6em;
    color: #fff;
    font-size: 0.8em;
    letter-spacing: 1px;
    white-space: pre;
  }

  @keyframes ticker-scroll {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  /* ---------- PORTRAIT ---------- */
  .portrait-col {
    grid-row: 1 / 3;
    position: relative;
    display: flex;
    align-items: stretch;
  }

  .portrait { cursor: pointer; }

  .portrait.drag-over {
    outline: 3px dashed var(--orange);
    outline-offset: -6px;
    filter: brightness(1.15);
  }

  /* Uploaded photo has real transparent pixels - drop the dark box so
     the page background shows through instead of a solid #444 square
     behind the transparent areas. */
  .portrait.has-transparency {
    background-color: transparent;
  }

  .arrow {
    position: absolute;
    left: 8px;
    font-size: 2vw;
    color: #c94a3d;
    font-weight: bold;
  }
  .arrow.up { top: 6px; }
  .arrow.down { bottom: 6px; }

  /* ---------- HEADER / NAME ---------- */
  .header-col {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    gap: 0.3em;
  }

  .codename {
    font-size: 2.6em;
    font-weight: bold;
    letter-spacing: 3px;
    margin: 0;
  }

  .subtitle {
    font-size: 1.3em;
    margin: 0;
  }

  /* ---------- STATS (LIFE/PSYCHE + GMP) ---------- */
  .stats-row {
    display: flex;
    gap: 0.2em;
    align-items: stretch;
  }

  .stat-bars {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 0.2em;
  }

  .stat-bar {
    display: grid;
    position: relative;
    grid-template-columns: 215px 1fr;
    background: var(--dark);
    flex-grow: 1;
    /* Draggable (see makeBarDraggable) - stops touch scrolling from
       hijacking a drag on mobile, and hints at the interaction on
       desktop. */
    touch-action: none;
    cursor: ew-resize;
  }

  .stat-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    background: var(--red);
    transition: width 0.2s ease;
  }

  .stat-label {
    position: relative;
    z-index: 1;
    color: #fff;
    font-weight: bold;
    font-size: 1.1em;
    display: flex;
    align-items: center;
    letter-spacing: 2px;
    margin-left: 1.2em;
  }

  .stat-value {
    position: relative;
    z-index: 1;
    color: #fff;
    font-size: 1.3em;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 20px;
  }

  .gmp-box {
    background: var(--dark);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: center;
    padding: 4px 16px;
    padding-left: 5em;
  }

  /* Drag left/right anywhere in the box to scrub the value (see
     makeHorizontalValueDrag); vertical touch-scrolling still works. */
  .gmp-box {
    cursor: ew-resize;
    touch-action: pan-y;
  }
  .gmp-box.scrubbing {
    user-select: none;
    -webkit-user-select: none;
  }
  .gmp-box .plain-number-input { cursor: text; }
  .gmp-box.scrubbing .plain-number-input { cursor: ew-resize; }

  .gmp-label {
    font-size: 0.9em;
    letter-spacing: 2px;
  }

  .gmp-value {
    font-size: 2.2em;
    font-weight: bold;
    line-height: 1;
  }

  /* Used by statNumberInput() for LIFE/PSYCHE/GMP+: strips the native
     number-input chrome (border, background, spinner arrows) so it's
     indistinguishable from plain text until clicked, while still being
     a real clickable/typeable field. Colors and font size come from
     the surrounding .stat-value/.gmp-value container, not from here. */
  .plain-number-input {
    font: inherit;
    color: inherit;
    background: transparent;
    border: none;
    outline: none;
    padding: 0;
    margin: 0;
    text-align: right;
    -moz-appearance: textfield;
    appearance: textfield;
  }
  .plain-number-input::-webkit-outer-spin-button,
  .plain-number-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .plain-number-input:focus,
  .plain-number-input:hover {
    outline: 1px dashed rgba(255, 255, 255, 0.55);
    outline-offset: 2px;
  }

  /* ---------- PARAMETERS + SICKNESSES ROW ---------- */
  .params-and-sick {
    display: flex;
    flex-wrap: nowrap;
    gap: 1em;
  }

  .params-section {
    display: flex;
    flex-direction: column;
    gap: 0.4em;
    min-width: 0;
    /* Take all the space left of the SICKNESSES panel, so adding or
       removing parameters never shifts Morale or the sickness bars. */
    flex: 1 1 auto;
  }

  .section-title {
    font-size: 1.15em;
    font-weight: bold;
    color: #444;
    letter-spacing: 2px;
  }

  .params-row {
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    gap: 4px;
    height: 80px;
    overflow-x: auto;
  }

  /* Flexible gap between the regular parameters and the permanent one
     (Morale): it absorbs all free space, so Morale stays pinned to the
     right end no matter how many regular parameters there are, while
     the parameter cells themselves never change size. */
  /* Empty fixed slot: same footprint as a parameter, but invisible. */
  .param-cell-empty {
    font-size: 1.2em;
    width: 2.4em;
    min-width: 2.4em;
    flex: 0 0 2.4em;
  }

  .param-spacer { flex: 1 1 0; min-width: 0.6em; }

  .param-cell {
    background: var(--dark);
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    color: #fff;
    font-weight: bold;
    font-size: 1.2em;
    /* Fixed size: cells must not grow or shrink as parameters are
       added or removed. */
    width: 2.4em;
    min-width: 2.4em;
    flex: 0 0 2.4em;
    /* Draggable (see makeBarDraggable) - stops touch scrolling from
       hijacking a drag on mobile, and hints at the interaction on
       desktop. */
    touch-action: none;
    cursor: ns-resize;
  }

  .param-cell:nth-child(6),
  .param-cell-empty:nth-child(6) {
    margin-left: .5em;
  }

  .param-fill {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    background: var(--red);
    transition: height 0.2s ease;
  }

  .param-icon {
    position: relative;
    z-index: 1;
    font-size: 1.6em;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .pixel-icon-svg {
    width: 1em;
    height: 1em;
    display: block;
    shape-rendering: crispEdges;
  }

  .param-grade {
    position: relative;
    z-index: 1;
    margin-bottom: 6px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    min-height: 1.3em;
  }

  .morale-rank-img {
    display: block;
    width: 1.3em;
    height: auto;
  }

  .param-cell.special .param-fill { background: var(--orange); }

  /* ---------- SICKNESSES PANEL ---------- */
  .sick-panel {
    display: flex;
    flex-direction: column;
    gap: 0.4em;
    flex: none;
  }

  .sick-row {
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    gap: 4px;
    height: 80px;
  }

  .sick-cell-wrap {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    width: 2.2em;
    height: 80px;
    border: 1px solid #555;
    overflow: hidden;
    /* Draggable (see makeBarDraggable) - stops touch scrolling from
       hijacking a drag on mobile, and hints at the interaction on
       desktop. */
    touch-action: none;
    cursor: ns-resize;
  }

  .sick-cell-hatch {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
  }

  .sick-cell-bar {
    position: absolute;

<div class="rotate-prompt">
  <div class="rotate-icon">📱</div>
  <div class="rotate-text">Please rotate your device to landscape<br>to view and edit the Staff ID card.</div>
</div>

<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/dropzone/5.9.3/dropzone.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/modern-screenshot@4.7.0/dist/index.js"></script>
<script type="module">
import van from 'https://cdn.jsdelivr.net/gh/vanjs-org/van/public/van-1.6.0.min.js';

Dropzone.autoDiscover = false;

const { div, span, button, input, textarea, h2, h3, img, canvas, a } = van.tags;

// ---------- helpers ----------
function clamp(n, min, max) { return Math.min(max, Math.max(min, n)); }

// Hover tooltip: any element with a non-empty `data-tip` attribute shows
// that text in a small popup next to the cursor. One delegated set of
// listeners handles everything (including cells the editor adds or
// re-renders later). Touch input is ignored - there's no hover on phones.
(function setupHoverTip() {
  const tip = document.createElement('div');
  tip.id = 'hover-tip';
  document.body.appendChild(tip);

  const tipTextFor = target => {
    const el = target && target.closest ? target.closest('[data-tip]') : null;
    return el ? (el.getAttribute('data-tip') || '') : '';
  };

  const place = e => {
    const pad = 4;
    const x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - pad);
    const y = Math.min(e.clientY + 18, window.innerHeight - tip.offsetHeight - pad);
    tip.style.transform = `translate(${Math.max(pad, x)}px, ${Math.max(pad, y)}px)`;
  };

  const update = e => {
    if (e.pointerType === 'touch') return;
    const text = tipTextFor(e.target);
    if (!text) { tip.classList.remove('show'); return; }
    if (tip.textContent !== text) tip.textContent = text;
    tip.classList.add('show');
    place(e);
  };

  document.addEventListener('pointerover', update);
  document.addEventListener('pointermove', update);
  document.addEventListener('pointerout', e => {
    if (!e.relatedTarget) tip.classList.remove('show');
  });
  document.addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch') tip.classList.remove('show');
  });
})();

// Adds click-and-drag ("scrub") support to a stat/param/sickness bar,
// for mouse, touch, and pen alike via the Pointer Events API (one code
// path for all input types rather than separate mouse/touch handlers).
// `orientation` is 'horizontal' (value increases left-to-right, for
// LIFE/PSYCHE) or 'vertical' (value increases bottom-to-top, for
// PARAMETERS/SICKNESSES, matching how those fills grow upward).
// `onScrub` receives a 0-1 fraction already clamped to the bar's own
// bounds; callers map that to their own value range.
function makeBarDraggable(el, orientation, onScrub) {
  let dragging = false;

  const fractionFromEvent = e => {
    const rect = el.getBoundingClientRect();
    if (orientation === 'horizontal') {
      return rect.width > 0 ? clamp((e.clientX - rect.left) / rect.width, 0, 1) : 0;
    }
    // Vertical bars fill from the bottom up, so "fraction full" is
    // measured from the bottom edge, not the usual top-down y.
    return rect.height > 0 ? clamp((rect.bottom - e.clientY) / rect.height, 0, 1) : 0;
  };

  el.addEventListener('pointerdown', e => {
    // Let normal interaction (typing into a number input, tapping a
    // link/button) proceed as-is instead of starting a drag over it.
    if (e.target.closest('input, textarea, button, a, [contenteditable="true"]')) return;
    dragging = true;
    el.setPointerCapture(e.pointerId);
    onScrub(fractionFromEvent(e));
    e.preventDefault();
  });
  el.addEventListener('pointermove', e => {
    if (!dragging) return;
    onScrub(fractionFromEvent(e));
  });
  const endDrag = e => {
    if (!dragging) return;
    dragging = false;
    try { el.releasePointerCapture(e.pointerId); } catch (err) { /* already released */ }
  };
  el.addEventListener('pointerup', endDrag);
  el.addEventListener('pointercancel', endDrag);
}

// Relative "drag to scrub" for a number (used by the GMP+ box): drag
// right to raise the value, left to lower it, always clamped to
// 0..max. Unlike makeBarDraggable (absolute position within a bar),
// this is delta-based, since the GMP range is far too large to map
// onto the box's width. A plain click (no real movement) is left alone
// so the number can still be focused and typed into. Step size scales
// with the starting value (10 per pixel up to 9,999, 100 per pixel up
// to 99,999, and so on); hold Shift for fine control (1 per pixel).
function makeHorizontalValueDrag(el, state, max) {
  const DRAG_THRESHOLD = 4; // px of movement before it counts as a drag
  let pending = false, dragging = false, startX = 0, startVal = 0, step = 10;

  el.addEventListener('pointerdown', e => {
    if (e.button !== undefined && e.button !== 0) return;
    pending = true;
    dragging = false;
    startX = e.clientX;
    startVal = clamp(Math.round(Number(state.val)) || 0, 0, max);
    const digits = String(startVal).length;
    step = 10 * Math.pow(10, Math.max(0, digits - 4));
  });
  el.addEventListener('pointermove', e => {
    if (!pending) return;
    const dx = e.clientX - startX;
    if (!dragging) {
      if (Math.abs(dx) < DRAG_THRESHOLD) return;
      dragging = true;
      el.setPointerCapture(e.pointerId);
      el.classList.add('scrubbing');
      // Leave typing mode so the number isn't left selected/focused.
      if (document.activeElement && el.contains(document.activeElement)) {
        document.activeElement.blur();
      }
      window.getSelection && window.getSelection().removeAllRanges();
    }
    const perPx = e.shiftKey ? 1 : step;
    state.val = clamp(Math.round(startVal + dx * perPx), 0, max);
  });
  const end = e => {
    if (dragging) {
      try { el.releasePointerCapture(e.pointerId); } catch (err) { /* already released */ }
    }
    pending = false;
    dragging = false;
    el.classList.remove('scrubbing');
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  return el;
}

function gradeFor(pct) {
  pct = Number(pct) || 0;
  if (pct >= 83.33) return 'S';
  if (pct >= 66.66) return 'A';
  if (pct >= 50) return 'B';
  if (pct >= 33.33) return 'C';
  if (pct >= 16.66) return 'D';
  if (pct > 0) return 'E';
  return '-';
}

// ---------- pixel-art icon set (alternative to emoji) ----------
// Each entry is a square grid ('#' = filled pixel, '.' = empty, any
// size) for the matching default parameter emoji. Rendered as an
// inline SVG using
// currentColor, so it inherits whatever color the emoji text would
// have had. Icons typed in by the user that aren't in this map simply
// keep showing as emoji/text - pixel mode only swaps recognized ones.
const PIXEL_ICONS = {
  '⚔️': [ // Combat (custom uploaded artwork)
    '#..........#',
    '##........##',
    '.##......##.',
    '..##....##..',
    '...##..##...',
    '....#.##....',
    '.....##.....',
    '.#..##.#..#.',
    '..###..###..',
    '..##....##..',
    '.##.#..#.##.',
    '##........##',
  ],
  '🔧': [ // R&D (custom uploaded artwork)
    '..###.......',
    '...##.......',
    '#..##.......',
    '#####.......',
    '######......',
    '....###.....',
    '.....###....',
    '......######',
    '.......#####',
    '.......##..#',
    '.......##...',
    '.......###..',
  ],
  '🍴': [ // Mess Hall (custom uploaded artwork)
    '................',
    '................',
    '..#...#.........',
    '.#.#.###........',
    '#.#.#.###.......',
    '.#.#.#.###......',
    '..#.###.###.....',
    '...#####.#####..',
    '....####..#####.',
    '.....####..####.',

// Picks the morale rank image for a given percentage - the bottom
// "grade" readout for the Morale parameter now uses these instead of
// the S/A/B/C/D/E letter grades (or a manually-typed special
// character). Same band edges as the icon-swap above: 80-100 / 60-79
// / 40-59 / 20-39 / 0-19.
function moraleRankImage(pct) {
  pct = Number(pct) || 0;
  if (pct >= 80) return MORALE_RANK_IMAGES.up3;
  if (pct >= 60) return MORALE_RANK_IMAGES.up1;
  if (pct >= 40) return MORALE_RANK_IMAGES.mid;
  if (pct >= 20) return MORALE_RANK_IMAGES.down1;
  return MORALE_RANK_IMAGES.down3;
}

// Picks the right morale drawing for a given percentage. Matches the
// same band edges the user specified: 80-100 / 60-79 / 40-59 / 20-39 / 0-19.
function moraleIconPattern(pct) {
  pct = Number(pct) || 0;
  if (pct >= 80) return MORALE_PIXEL_ICONS.up3;
  if (pct >= 60) return MORALE_PIXEL_ICONS.up1;
  if (pct >= 40) return MORALE_PIXEL_ICONS.mid;
  if (pct >= 20) return MORALE_PIXEL_ICONS.down1;
  return MORALE_PIXEL_ICONS.down3;
}

// Builds an inline SVG from a pixel grid. Grids need not be square -
// width comes from the longest row, height from the row count - and
// the element is sized in CSS to preserve that aspect ratio within a
// 1em-ish box, so wide/short icons don't get stretched or squashed.
function buildPixelSVG(rows) {
  const svgNS = 'http://www.w3.org/2000/svg';
  const gridH = rows.length;
  const gridW = rows.reduce((max, row) => Math.max(max, row.length), 0);
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${gridW} ${gridH}`);
  svg.setAttribute('class', 'pixel-icon-svg');
  if (gridW >= gridH) {
    svg.style.width = '1em';
    svg.style.height = `${gridH / gridW}em`;
  } else {
    svg.style.height = '1em';
    svg.style.width = `${gridW / gridH}em`;
  }
  rows.forEach((row, y) => {
    for (let x = 0; x < row.length; x++) {
      if (row[x] === '#') {
        const rect = document.createElementNS(svgNS, 'rect');
        rect.setAttribute('x', String(x));
        rect.setAttribute('y', String(y));
        rect.setAttribute('width', '1');
        rect.setAttribute('height', '1');
        rect.setAttribute('fill', 'currentColor');
        svg.appendChild(rect);
      }
    }
  });
  return svg;
}

// Builds a container that swaps between the raw emoji/text icon and its
// pixel-art SVG equivalent (when one exists) as pixelIconMode or the
// param's icon value changes. Imperative DOM update (rather than a
// van reactive child) since the two render modes are different node
// types (text vs. SVG element), not just a changed primitive value.
function ParamIcon(p) {
  const container = span({ class: 'param-icon' });
  van.derive(() => {
    const iconVal = p.icon.val;
    const pattern = pixelIconMode.val ? PIXEL_ICONS[iconVal] : null;
    container.innerHTML = '';
    if (pattern) {
      container.appendChild(buildPixelSVG(pattern));
    } else {
      container.textContent = iconVal;
    }
  });
  return container;
}

// Same idea as ParamIcon, but for skill icons: swaps between the raw
// emoji/text icon and its pixel-art SVG equivalent (when one exists)
// using the same pixelIconMode toggle. Unlike a parameter, a skill's
// icon can legitimately be empty (no icon set), in which case nothing
// is rendered at all rather than falling back to a placeholder glyph.
function SkillIcon(s) {
  const container = span({ class: 'skill-icon skill-icon-el' });
  van.derive(() => {
    const iconVal = s.icon.val;
    // Hide the icon entirely whenever the skill has no name text - an
    // icon with nothing next to it reads as a stray leftover slot, in
    // both the live preview and the exported PNG (which is just a
    // screenshot of this same DOM). It reappears as soon as a name is
    // typed back in.
    const hasName = s.name.val.trim().length > 0;
    const pattern = (hasName && pixelIconMode.val) ? PIXEL_ICONS[iconVal] : null;
    container.innerHTML = '';
    if (!hasName) return;
    if (pattern) {
      container.appendChild(buildPixelSVG(pattern));
    } else if (iconVal) {
      container.textContent = iconVal;
    }
  });
  return container;
}

// Fixed (non-editable) icon for a sickness column, same emoji/pixel-art
// swap behavior as ParamIcon/SkillIcon above but with no underlying
// state to read - the emoji is a constant (e.g. HOSTILITY_ICON_EMOJI,
// SICK_ICON_EMOJI) passed in by the caller - so it only needs to react
// to the global pixelIconMode toggle.
function SicknessIcon(emoji) {
  const container = span({ class: 'sickness-icon' });
  van.derive(() => {
    const pattern = pixelIconMode.val ? PIXEL_ICONS[emoji] : null;
    container.innerHTML = '';
    if (pattern) {
      container.appendChild(buildPixelSVG(pattern));
    } else {
      container.textContent = emoji;
    }
  });
  return container;
}

function makeSkill(icon, name) {
  return {
    icon: van.state(icon || ''),
    name: van.state(name || ''),
  };
}

function makeParam(icon, percent, special, specialGrade, locked, permanent, vacant) {
  return {
    icon: van.state(icon),
    percent: van.state(percent),
    special: van.state(!!special),
    specialGrade: van.state(specialGrade || 'S'),
    // Plain (non-reactive) flag: whether this parameter's position in
    // the list is fixed. It's fixed per-param for its whole lifetime,
    // never toggled at runtime, so it doesn't need to be a van.state.
    locked: !!locked,
    // Plain flag: a permanent parameter (Morale) has no remove button
    // and a read-only icon, so it can never be deleted or renamed away.
    // Morale's icon also counts as permanent for back-compat with older saves.
    permanent: !!permanent || icon === MORALE_ICON_EMOJI,
    // Plain flag: an empty fixed slot left behind when a locked parameter
    // (one of the 13 fixed slots) is deleted. It keeps the slot's position so
    // nothing shifts, and the next parameter added fills it.
    vacant: !!vacant,
  };
}

// ---------- persistence (localStorage) ----------

const STORAGE_KEY = 'mgsCharacterCard:v1';

function collectSerializable() {
  return {
    version: 1,
    codename: codename.val,
    clsPart: clsPart.val,
    rolePart: rolePart.val,
    pronounsPart: pronounsPart.val,
    life: life.val,
    psyche: psyche.val,
    gmp: gmp.val,
    profileImg: profileImg.val,
    halftoneEnabled: halftoneEnabled.val,
    quote: quote.val,
    ticker: ticker.val,
    pixelIconMode: pixelIconMode.val,
    skills: skills.map(s => ({ icon: s.icon.val, name: s.name.val })),
    sicknesses: sicknesses.map(s => s.val),
    paramsList: paramsList.val.map(p => ({
      icon: p.icon.val,
      percent: p.percent.val,
      special: p.special.val,
      specialGrade: p.specialGrade.val,
      locked: p.locked,
      permanent: p.permanent,
      vacant: p.vacant,
    })),
  };
}

function loadSavedState() {
  let raw;
  try {
    raw = localStorage.getItem(STORAGE_KEY);
  } catch (err) {
    // Some browsers throw just for accessing localStorage (e.g. certain
    // private-browsing modes with storage disabled entirely).
    console.warn('localStorage is unavailable; entries will not be remembered between visits:', err);
    return;
  }
  if (!raw) return;

  let data;
  try {
    data = JSON.parse(raw);
  } catch (err) {
    console.warn('Saved character card data was corrupted; starting fresh:', err);
    return;
  }
  if (!data || typeof data !== 'object') return;

  if (typeof data.codename === 'string') codename.val = data.codename.slice(0, CODENAME_MAX);
  if (typeof data.clsPart === 'string') clsPart.val = data.clsPart;
  if (typeof data.rolePart === 'string') rolePart.val = data.rolePart;
  if (typeof data.pronounsPart === 'string') pronounsPart.val = data.pronounsPart;
  if (typeof data.life === 'number') life.val = clamp(Math.round(data.life), 0, 9999);
  if (typeof data.psyche === 'number') psyche.val = clamp(Math.round(data.psyche), 0, 9999);
  if (typeof data.gmp === 'number') gmp.val = clamp(Math.round(data.gmp), 0, 999999);
  if (typeof data.halftoneEnabled === 'boolean') halftoneEnabled.val = data.halftoneEnabled;
  if (typeof data.profileImg === 'string') setProfileImage(data.profileImg);
  if (typeof data.quote === 'string') quote.val = data.quote.slice(0, QUOTE_MAX);
  if (typeof data.ticker === 'string') ticker.val = data.ticker;
  if (typeof data.pixelIconMode === 'boolean') pixelIconMode.val = data.pixelIconMode;

  if (Array.isArray(data.skills)) {
    data.skills.forEach((val, i) => {
      if (!skills[i]) return;
      if (val && typeof val === 'object') {
        // Current format: separate icon + name fields.
        if (typeof val.icon === 'string') skills[i].icon.val = val.icon;
        if (typeof val.name === 'string') skills[i].name.val = val.name.slice(0, SKILL_NAME_MAX);
      } else if (typeof val === 'string') {
        // Back-compat: older saves stored one combined string (e.g.
        // "⭐ Skill Name"). Best-effort split on the first space so
        // existing saved cards migrate without losing data.
        const spaceIdx = val.indexOf(' ');
        if (spaceIdx === -1) {
          skills[i].icon.val = '';
          skills[i].name.val = val.slice(0, SKILL_NAME_MAX);
        } else {
          skills[i].icon.val = val.slice(0, spaceIdx);
          skills[i].name.val = val.slice(spaceIdx + 1).slice(0, SKILL_NAME_MAX);
        }
      }
    });
  }

  if (Array.isArray(data.paramsList) && data.paramsList.length > 0) {
    // The 13 default slots (Combat ... Defense) are always locked in
    // place, even in cards saved before the lock flag existed: a saved
    // parameter whose icon still matches the default at the same
    // position keeps that fixed slot.
    const defaultSlots = createDefaultParams().filter(d => !d.permanent);
    paramsList.val = data.paramsList.map((p, i) => makeParam(
      typeof p.icon === 'string' ? p.icon : '\u2753',
      clamp(Number(p.percent) || 0, 0, 100),
      !!p.special,
      typeof p.specialGrade === 'string' ? p.specialGrade : 'S',
      !!p.locked || !!p.vacant || (i < defaultSlots.length && p.icon === defaultSlots[i].icon.val),
      !!p.permanent,
      !!p.vacant,
    ));
    // Enforce the slot cap on loaded data (Morale is exempt).
    {
      let seen = 0;
      paramsList.val = paramsList.val.filter(p => p.permanent || ++seen <= MAX_PARAM_SLOTS);
    }
    // Safety net: if an older/edited save somehow lacks Morale, restore it.
    if (!paramsList.val.some(p => p.permanent)) {
      paramsList.val = [...paramsList.val, makeParam(MORALE_ICON_EMOJI, 100, true, '\u21c8', false, true)];
    }
  }

  if (Array.isArray(data.sicknesses)) {
    data.sicknesses.forEach((v, i) => {
      if (!sicknesses[i]) return;
      sicknesses[i].val = clamp(Number(v) || 0, 0, 99);
    });
  }
}

let saveTimer = null;
function persistNow() {
  clearTimeout(saveTimer);
  const data = collectSerializable();
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (err) {
    // Most commonly a QuotaExceededError - the profile photo is stored
    // as a base64 data URL and can be large. Rather than losing every
    // other edit, retry without the photo so text/stat changes still stick.
    console.warn('Could not save full card (photo too large?); retrying without photo:', err);
    try {
      data.profileImg = null;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (err2) {
      console.warn('Could not save character card to localStorage:', err2);
    }
  }
}
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persistNow, 300);
}

// Flush any pending debounced save when the page is hidden or closed, so
// a change made in the last 300ms before refreshing/leaving isn't lost.
window.addEventListener('pagehide', persistNow);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') persistNow();
});

// Restore any previously-saved entries before the card is first built,
// so the initial render already reflects them.
loadSavedState();

// Auto-save whenever any persisted field changes. Reading every field
// here (via collectSerializable) is what registers them all as this
// derive's dependencies; the actual write happens after a short
// debounce so rapid typing doesn't hit localStorage on every keystroke.
// This has no DOM involvement at all, so it can't cause the
// focus-loss/rebuild issues we ran into elsewhere in this file.
van.derive(() => {
  collectSerializable();
  scheduleSave();
});

// ---------- card display ----------

function StatBar(labelText, valueState) {
  const el = div({ class: 'stat-bar' },
    div({ class: 'stat-fill', style: () => `width:${clamp(valueState.val / 9999 * 100, 0, 100)}%` }),

    div({ class: 'stat-value' }, statNumberInput(valueState, 9999, 4)),
  );
  makeBarDraggable(el, 'horizontal', frac => { valueState.val = clamp(Math.round(frac * 9999), 0, 9999); });
  return el;
}

function ParamCell(p) {
  const el = div({
    class: () => 'param-cell' + (p.special.val ? ' special' : ''),
    'data-tip': () => PARAM_ICON_NAMES[p.icon.val] || '',
  },
    div({ class: 'param-fill', style: () => `height:${clamp(Number(p.percent.val) || 0, 0, 100)}%` }),
    ParamIcon(p),
    span({ class: 'param-grade' }, () => {
      // Morale's rank image is driven purely by its percentage - it
      // ignores the "special" flag/character entirely, so this checks
      // the icon specifically rather than p.special.val.
      if (p.icon.val === MORALE_ICON_EMOJI) {
        return img({ class: 'morale-rank-img', src: moraleRankImage(p.percent.val), alt: '', draggable: 'false' });
      }
      return p.special.val ? p.specialGrade.val : gradeFor(p.percent.val);
    }),
  );
  makeBarDraggable(el, 'vertical', frac => { p.percent.val = clamp(Math.round(frac * 100), 0, 100); });
  return el;
}

// One column in the SICKNESSES row. Each holds a hatch-pattern canvas
// (drawn by drawSickHatch - see the PNG-export notes near the bottom of
// this file for why it's a <canvas> rather than a CSS gradient) and a
// red fill bar, only one of which is shown at a time:
//   - value === 0  -> hatch canvas visible, bar hidden (the "off" state)
//   - value 1-99   -> bar visible at that height %, hatch hidden
// Columns with an entry in SICKNESS_ICONS also get that fixed icon
// (emoji or pixel-art, matching the global toggle) plus a number
// readout of the current value, styled like a parameter's letter-grade
// text. Both are hidden at value 0 along with the bar - there's
// nothing meaningful to show once that sickness is "off" - and
// reappear together as soon as the value is 1 or higher.
const SICKNESS_ICONS = [HOSTILITY_ICON_EMOJI, SICK_ICON_EMOJI, WOUNDED_ICON_EMOJI, PTSD_ICON_EMOJI];
const SICKNESS_LABELS = ['Hostility', 'Sick', 'Wounded', 'PTSD'];

function SicknessCell(i) {
  const state = sicknesses[i];
  const canvasEl = canvas({ class: 'sick-cell-hatch' });
  const barEl = div({
    class: 'sick-cell-bar',
    style: () => {
      const v = clamp(Number(state.val) || 0, 0, 99);
      return `height:${v}%;display:${v > 0 ? 'block' : 'none'}`;
    },
  });
  van.derive(() => {
    const v = clamp(Number(state.val) || 0, 0, 99);
    canvasEl.style.display = v > 0 ? 'none' : 'block';
    // Redraw whenever the hatch becomes visible again, in case it was
    // never (or wrongly) drawn while hidden.
    if (v === 0 && canvasEl.isConnected) drawSickHatch(canvasEl);
  });

  let iconCol = '';
  const emoji = SICKNESS_ICONS[i];
  if (emoji) {
    const gradeEl = span({ class: 'sickness-grade' }, () => {
      const v = clamp(Number(state.val) || 0, 0, 99);
      return v > 0 ? String(v) : '';
    });
    iconCol = div({ class: 'sickness-icon-col' }, SicknessIcon(emoji), gradeEl);
    van.derive(() => {
      const v = clamp(Number(state.val) || 0, 0, 99);
      iconCol.style.display = v > 0 ? 'flex' : 'none';
    });
  }

  const wrapEl = div({ class: 'sick-cell-wrap', 'data-tip': SICKNESS_LABELS[i] || '' },
    canvasEl,
    barEl,
    iconCol,
  );
  makeBarDraggable(wrapEl, 'vertical', frac => { state.val = clamp(Math.round(frac * 99), 0, 99); });
  return wrapEl;
}

// The scrolling black bar along the very bottom edge of the card,
// recreated from the gameplay-tip ticker on Peace Walker's actual
// Staff Management screen. Rendered as two back-to-back copies of the
// same text inside a track that animates from translateX(0) to
// translateX(-50%) - since the copies are identical, the moment the
// first one scrolls fully offscreen the second is in exactly the
// position the first started in, so the loop point is invisible and
// it reads as one continuously-scrolling message rather than a
// visible reset/jump. Both copies read reactively from the same
// `ticker` state (fixed at DEFAULT_TICKER - there's no dialog field
// for it, so it isn't user-editable), so if that state ever changes
// both copies update together.
function TickerTape() {
  return div({ class: 'ticker-tape' },
    div({ class: 'ticker-track' },
      span({ class: 'ticker-segment' }, () => ticker.val),
      span({ class: 'ticker-segment' }, () => ticker.val),

  );
}

// ---------- editor dialog ----------

function Field(labelText, el) {
  return div({ class: 'field' }, div({}, labelText), el);
}

function numberInput(state, min, max) {
  const el = input({
    type: 'number', min, max, value: state.val,
    oninput: e => {
      const v = clamp(parseInt(e.target.value, 10) || 0, min, max);
      state.val = v;
    },
  });
  // Reflect changes made elsewhere (e.g. directly on the card via
  // contenteditable) - but only while this field isn't focused, so we
  // never fight the user mid-keystroke or reset the caret.
  van.derive(() => {
    const v = state.val;
    if (document.activeElement !== el && Number(el.value) !== v) el.value = v;
  });
  return el;
}

// The QUOTE/BIO field in the dialog, built the same way as
// numberInput() above: a plain, uncontrolled textarea whose own typing
// is untouched, plus a derive that pulls in changes made elsewhere
// (e.g. directly on the card's quote box) whenever this field isn't
// the one currently focused. Every other field already followed this
// pattern; this textarea previously didn't, which is what let it and
// the on-card quote box drift out of sync with each other.
function quoteTextarea(state) {
  const el = textarea({
    value: state.val,
    maxlength: QUOTE_MAX,
    oninput: e => { state.val = e.target.value; },
  });
  van.derive(() => {
    const v = state.val;
    if (document.activeElement !== el && el.value !== v) el.value = v;
  });
  return el;
}

// A number input styled to sit directly on the card (LIFE/PSYCHE/GMP+)
// rather than in the edit dialog: no visible border/background/spinner
// arrows, just plain text the person can click into and type over. The
// .plain-number-input CSS class does the visual stripping; padLength
// (e.g. 4 for "0100") formats the value while unfocused, but shows the
// bare number while the user is actively editing so they aren't
// fighting leading zeros mid-keystroke.
function statNumberInput(state, max, padLength) {
  const format = v => {
    const n = clamp(Math.round(Number(v)) || 0, 0, max);
    return padLength ? String(n).padStart(padLength, '0') : String(n);
  };
  const chWidth = String(max).length;
  const el = input({
    type: 'number', min: 0, max, inputmode: 'numeric',
    class: 'plain-number-input',
    style: `width:${chWidth}ch`,
    value: format(state.val),
    oninput: e => {
      const v = clamp(parseInt(e.target.value, 10) || 0, 0, max);
      state.val = v;
    },
    onfocus: e => {
      // Show the bare number (no padding) while editing, and select it
      // so typing immediately replaces it rather than inserting.
      e.target.value = String(clamp(Math.round(state.val) || 0, 0, max));
      e.target.select();
    },
    onblur: e => { e.target.value = format(state.val); },
  });
  van.derive(() => {
    const v = state.val;
    if (document.activeElement !== el) el.value = format(v);
  });
  return el;
}

function textInput(state, placeholder, maxLen) {
  const el = input({
    type: 'text', value: state.val, placeholder: placeholder || '',
    oninput: e => { state.val = e.target.value; },
  });
  if (maxLen) el.maxLength = maxLen;
  van.derive(() => {
    const v = state.val;
    if (document.activeElement !== el && el.value !== v) el.value = v;
  });
  return el;
}

// ---------- inline contenteditable fields (direct editing on the card) ----------

function pastePlainText(e) {
  e.preventDefault();
  const text = (e.clipboardData || window.clipboardData).getData('text/plain');
  // execCommand is deprecated but remains the simplest cross-browser
  // way to insert plain text into a contenteditable at the caret
  // without pulling in a rich-text editing library.
  document.execCommand('insertText', false, text);
}

// Single-line editable field (codename, class/role/pronouns, skills):
// Enter confirms/blurs rather than inserting a line break, and pasted
// content is flattened to plain text on one line.
function editableInline(tagFn, state, opts = {}) {
  const { extraClass = '', placeholder = '', maxLen = 0 } = opts;
  // Trim to maxLen (if set) and keep the caret at the end.
  const enforceMax = node => {
    if (!maxLen || node.textContent.length <= maxLen) return;
    node.textContent = node.textContent.slice(0, maxLen);
    const range = document.createRange();
    range.selectNodeContents(node);
    range.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  };
  const el = tagFn({
    class: `editable-text ${extraClass}`.trim(),
    contenteditable: 'true',
    spellcheck: 'false',
    'data-placeholder': placeholder,
    // Block typed characters once full (unless replacing a selection).
    onbeforeinput: e => {
      if (!maxLen || !e.data || e.inputType === 'insertFromPaste') return;
      const sel = window.getSelection();
      const selected = sel && el.contains(sel.anchorNode) ? sel.toString().length : 0;
      if (el.textContent.length - selected + e.data.length > maxLen) e.preventDefault();
    },
    oninput: e => { enforceMax(e.currentTarget); state.val = e.currentTarget.textContent; },
    onkeydown: e => {
      if (e.key === 'Enter') { e.preventDefault(); e.currentTarget.blur(); }
    },
    onpaste: e => {
      pastePlainText(e);
      // insertText fires its own input event, but normalize afterwards
      // in case a newline slipped through (e.g. via IME/other paths).
      setTimeout(() => {
        const flat = el.textContent.replace(/[\r\n]+/g, ' ');
        if (flat !== el.textContent) el.textContent = flat;
        enforceMax(el);
        state.val = el.textContent;
      }, 0);
    },
  }, state.val);

  // Sync in external changes (from the sidebar dialog, or any other
  // consumer of this state) - but skip while this element has focus,
  // so we never overwrite text the user is actively typing and reset
  // their caret position.
  van.derive(() => {
    const v = state.val;
    if (document.activeElement !== el && el.textContent !== v) el.textContent = v;
  });

  return el;
}

// Editable-text field on the card with a small preset dropdown attached
// (used for the class, role, pronouns, and skill fields - see
// ClassField()/RoleField()/PronounsField()/SkillField()). Clicking
// (really, focusing) the box opens the dropdown; picking a preset fills
// the box and closes it, while typing directly still works exactly as
// before. `key` identifies this field in openPresetDropdown so opening
// one field's dropdown closes any other that's open. `opts.extraClass`
// and `opts.textEl` (an already-built element to wrap, e.g. a skill's
// SkillIcon-paired editableInline) let callers with their own field
// element reuse the same dropdown wiring instead of building a plain one.
function presetField(state, presets, key, placeholder, opts = {}) {
  const el = opts.textEl || editableInline(span, state, { placeholder, extraClass: opts.extraClass });
  el.addEventListener('focus', () => { openPresetDropdown.val = key; });

  const wrap = span(
    { class: 'class-field-wrap' },
    el,
    div(
      { class: () => 'class-dropdown' + (openPresetDropdown.val === key ? ' open' : '') },
      ...presets.map(preset => button({
        type: 'button',
        class: 'class-dropdown-item',
        onclick: () => {
          state.val = preset;
          // editableInline's own van.derive skips syncing while the box
          // is focused - it just lost focus to this button, so update
          // the visible text directly rather than waiting on that.
          el.textContent = preset;
          openPresetDropdown.val = null;
        },
      }, preset)),
    ),
  );
  return wrap;
}

function ClassField() {
  return presetField(clsPart, CLASS_PRESETS, 'class', 'Class');
}

function RoleField() {
  return presetField(rolePart, ROLE_PRESETS, 'role', 'Role');
}

function PronounsField() {
  return presetField(pronounsPart, PRONOUNS_PRESETS, 'pronouns', 'Pronouns');
}

// One skill slot's name field on the card, with the same preset
// dropdown as class/role/pronouns. Each of the 4 skill slots gets its
// own key ('skill-0'..'skill-3') so opening one only closes the others,
// same as any other field.
function SkillField(s, i) {
  const el = editableInline(span, s.name, { extraClass: 'skill-name-text', placeholder: `Skill ${i + 1}`, maxLen: SKILL_NAME_MAX });
  return presetField(s.name, SKILL_PRESETS, `skill-${i}`, `Skill ${i + 1}`, { textEl: el });
}

// Closes any open preset dropdown on a click outside every field - covers
// clicking elsewhere on the card, in the sidebar, or blurring without
// picking a preset. mousedown (not click) so it fires before a new
// focus target steals focus from the field.
document.addEventListener('mousedown', e => {
  if (e.target.closest('.class-field-wrap')) return;
  openPresetDropdown.val = null;
});

// Multi-line editable field (quote/bio): Enter is allowed to insert a
// real line break, matching the textarea in the sidebar dialog.
function editableMultiline(tagFn, state, opts = {}) {
  const { extraClass = '', defaultValue = null, maxLen = 0 } = opts;
  // Trim to maxLen (if set) and keep the caret at the end.
  const enforceMax = node => {
    if (!maxLen || node.innerText.length <= maxLen) return;
    node.innerText = node.innerText.slice(0, maxLen);
    const range = document.createRange();
    range.selectNodeContents(node);
    range.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  };
  const el = tagFn({
    class: `editable-text ${extraClass}`.trim(),
    contenteditable: 'true',
    spellcheck: 'false',
    // Block typed characters/line breaks once full (unless replacing a
    // selection); pasted text is trimmed in oninput below.
    onbeforeinput: e => {
      if (!maxLen || e.inputType === 'insertFromPaste') return;
      const adds = e.inputType === 'insertParagraph' || e.inputType === 'insertLineBreak' ? 1 : (e.data ? e.data.length : 0);
      if (!adds) return;
      const sel = window.getSelection();
      const selected = sel && el.contains(sel.anchorNode) ? sel.toString().length : 0;
      if (el.innerText.length - selected + adds > maxLen) e.preventDefault();
    },
    oninput: e => { enforceMax(e.currentTarget); state.val = e.currentTarget.innerText; },
    onpaste: pastePlainText,
    onfocus: e => {
      // Clicking into the box while it still holds the untouched
      // default/placeholder text clears it immediately, so the first
      // character typed starts a fresh quote instead of being inserted
      // somewhere in the middle of the default sentence (contenteditable
      // has no separate placeholder layer like <input> does - this text
      // is real content, so it has to be cleared explicitly).
      if (defaultValue !== null && state.val === defaultValue) {
        e.currentTarget.innerText = '';
        state.val = '';
      }
    },
  }, state.val);

  van.derive(() => {
    const v = state.val;
    if (document.activeElement !== el && el.innerText !== v) el.innerText = v;
  });

  return el;
}

// Icon + name pair for one skill slot, in the sidebar editor - mirrors
// the icon input on ParamEditRow below (same maxlength, same plain
// text-or-emoji input) so picking a skill icon works identically to
// picking a parameter icon. Reuses textInput() for both fields, which
// already keeps them in sync with any external state change.
function SkillEditRow(s, i) {
  const iconInput = textInput(s.icon, '⭐');
  iconInput.maxLength = 4;
  iconInput.setAttribute('aria-label', `Skill ${i + 1} icon`);
  const nameInput = textInput(s.name, `Skill ${i + 1}`, SKILL_NAME_MAX);
  nameInput.setAttribute('aria-label', `Skill ${i + 1} name`);
  return div({ class: 'skill-edit-row' }, iconInput, nameInput);
}

// Tracks the parameter currently being dragged, for the duration of a
// single drag gesture. Kept in module scope rather than dataTransfer
// since this is a same-page, same-list drag - no need to serialize it.
let draggedParam = null;

function ParamEditRow(p, onRemove) {
  if (p.vacant) {
    return div({ class: 'param-edit-row locked-param' },
      span({ class: 'param-lock-icon', title: 'Fixed position' }, '\u{1F512}'),
      span({ style: 'opacity:0.6;font-size:0.9em;' }, 'Empty fixed slot - the next parameter you add fills it'),
    );
  }
  const row = div({ class: 'param-edit-row' + (p.locked ? ' locked-param' : '') },
    p.locked
      ? span({ class: 'param-lock-icon', title: "This parameter's position is fixed" }, '\u{1F512}')
      : span({
          class: 'param-drag-handle',
          title: 'Drag to reorder',
          draggable: 'true',
          ondragstart: e => {
            draggedParam = p;
            row.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            // Firefox requires setData to be called for drag to start.
            e.dataTransfer.setData('text/plain', '');
          },
          ondragend: () => {
            draggedParam = null;
            row.classList.remove('dragging');
          },
        }, '\u283f'),
    input({
      type: 'text', value: p.icon.val, maxlength: 4,
      readOnly: p.permanent,
      title: p.permanent ? "This parameter can't be changed or removed" : '',
      oninput: e => { p.icon.val = e.target.value; },
    }),
    input({
      type: 'number', min: 0, max: 100, value: p.percent.val,
      oninput: e => { p.percent.val = clamp(parseInt(e.target.value, 10) || 0, 0, 100); },
    }),
    span({ class: 'grade-preview' }, () => {
      // Morale's rank is chosen automatically from its percentage (see
      // MORALE_RANK_IMAGES / moraleRankImage above), so it gets a live
      // image preview here instead of a letter grade, regardless of
      // the special flag - it has no checkbox to control that (below).
      if (p.icon.val === MORALE_ICON_EMOJI) {
        return img({ class: 'grade-preview-img', src: moraleRankImage(p.percent.val), alt: '', draggable: 'false' });
      }
      return p.special.val ? '' : gradeFor(p.percent.val);
    }),
    () => {
      // Static, uneditable name for whatever icon this row currently
      // holds (e.g. '🚶' -> "Walk"), purely so the person editing the
      // card can tell parameters apart at a glance. Recomputed here
      // since p.icon.val is itself editable text.
      const title = PARAM_ICON_NAMES[p.icon.val] || '';
      // Every parameter except Morale keeps the "special" checkbox
      // (and, when checked, a free-text character to show instead of
      // the letter grade). Morale's rank is fully automatic from its
      // percentage, so it gets no checkbox at all - just the name.
      if (p.icon.val === MORALE_ICON_EMOJI) {
        return div({ style: 'display:flex;align-items:center;' },
          span({ class: 'param-name-lbl' }, title),
        );
      }
      return div({ style: 'display:flex;flex-direction:column;gap:2px;' },
        label({ class: 'special-lbl' },
          input({
            type: 'checkbox', checked: p.special.val,
            onchange: e => { p.special.val = e.target.checked; },
          }),
          'special',
          span({ class: 'param-name-lbl' }, title),
        ),
        () => p.special.val ? input({
          type: 'text', value: p.specialGrade.val, maxlength: 3,
          style: 'width:36px;padding:2px;',
          oninput: e => { p.specialGrade.val = e.target.value; },
        }) : '',
      );
    },
    p.permanent
      ? span({ class: 'param-permanent-icon', title: "This parameter can't be removed" }, '\u{1F512}')
      : button({
          class: 'remove-param',
          onclick: onRemove,
        }, '\u2715'),
  );

  // Locked rows accept no drops at all - with no ondragover handler,
  // the browser shows its native "not allowed" cursor automatically
  // and no 'drop' event can fire here, so a dragged parameter simply
  // can't be placed at (or displace) a locked row's position.
  if (!p.locked) {
    row.ondragover = e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    };
    row.ondrop = e => {
      e.preventDefault();
      if (draggedParam && draggedParam !== p) reorderParams(draggedParam, p);
    };
  }

  return row;
}

// Reorders paramsList so `dragged` ends up where `target` was, WITHOUT
// ever changing the array index of any locked parameter. Locked
// parameters keep their exact original position; only the unlocked
// ones are reshuffled among the remaining (unlocked) slots.
function reorderParams(dragged, target) {
  if (!dragged || !target || dragged === target || dragged.locked || target.locked) return;

  const current = paramsList.val;
  const unlocked = current.filter(p => !p.locked);

  const fromIdx = unlocked.indexOf(dragged);
  if (fromIdx === -1) return;
  unlocked.splice(fromIdx, 1);

  const toIdx = unlocked.indexOf(target);
  unlocked.splice(toIdx === -1 ? unlocked.length : toIdx, 0, dragged);

  let ui = 0;
  const result = current.map(p => (p.locked ? p : unlocked[ui++]));

  paramsList.val = result;
  // The dialog's rows are managed imperatively (see ParamsEditorSection
  // below), so an explicit resync is needed to reflect the new order -
  // this is only ever called from a discrete user action (drag-drop),
  // never reactively, so it can't reintroduce the per-keystroke
  // rebuild issue that pattern caused elsewhere in this file.
  if (resyncParamsEditor) resyncParamsEditor();
}

// Builds and owns the list of parameter-editor rows imperatively
// (plain DOM add/remove on explicit user actions) instead of via a
// van reactive binding keyed on paramsList.val. A reactive binding
// here would re-run - rebuilding EVERY row's DOM node from scratch -
// on ANY field change in ANY row, because ParamEditRow() reads each
// row's icon/percent/special .val synchronously to set initial input
// values; those reads would get captured as dependencies of the same
// binding that maps over the whole list. That's exactly why typing a
// second digit into a parameter box required refocusing: the row
// (and its focused input) was being destroyed and recreated after
// every keystroke. Building rows once and only touching the DOM on
// add/remove avoids that entirely - normal typing never touches this
// container.
let resyncParamsEditor = null;

function ParamsEditorSection() {
  const rowsContainer = div({ style: 'display:contents' });
  const rowElByParam = new Map();

  function addRow(p) {
    const rowEl = ParamEditRow(p, () => {
      if (p.permanent) return;
      if (p.locked) {
        // One of the fixed slots (the first five): leave an empty slot
        // in the same position so nothing shifts; a newly added
        // parameter will fill it.
        const vacant = makeParam('', 0, false, 'S', true, false, true);
        paramsList.val = paramsList.val.map(item => item === p ? vacant : item);
        rebuildAll();
        return;
      }
      paramsList.val = paramsList.val.filter(item => item !== p);
      const el = rowElByParam.get(p);
      if (el) { el.remove(); rowElByParam.delete(p); }
    });
    rowElByParam.set(p, rowEl);
    van.add(rowsContainer, rowEl);
  }

  function rebuildAll() {
    rowElByParam.forEach(el => el.remove());
    rowElByParam.clear();
    paramsList.val.forEach(addRow);
  }

  rebuildAll();
  // Exposed so resetCard() can refresh these rows after replacing
  // paramsList.val wholesale. This is only ever called from an
  // explicit user action (the Reset button), never reactively, so it
  // can't reintroduce the per-keystroke rebuild bug this section was
  // rewritten to avoid.
  resyncParamsEditor = rebuildAll;

  return div({},
    rowsContainer,
    button({
      class: 'add-param-btn',
      // Full when every slot is taken and the cap is reached.
      disabled: () => !paramsList.val.some(item => item.vacant) && paramSlotCount() >= MAX_PARAM_SLOTS,
      title: () => (!paramsList.val.some(item => item.vacant) && paramSlotCount() >= MAX_PARAM_SLOTS)
        ? `Maximum of ${MAX_PARAM_SLOTS} parameters reached - delete one to add another` : '',
      onclick: () => {
        const slot = paramsList.val.findIndex(item => item.vacant);
        if (slot !== -1) {
          // Fill the first empty fixed slot; the new parameter is locked
          // there like the originals.
          const filled = makeParam('\u2753', 50, false, 'S', true);
          paramsList.val = paramsList.val.map((item, i) => i === slot ? filled : item);
          rebuildAll();
          return;
        }
        if (paramSlotCount() >= MAX_PARAM_SLOTS) return;
        const p = makeParam('\u2753', 50);
        paramsList.val = [...paramsList.val, p];
        addRow(p);
      },
    }, '+ ADD PARAMETER'),
  );
}

// need "label" tag
const { label } = van.tags;

let dropzoneInstance = null;

// Inspects a data-URL image for any actually-transparent pixels (alpha
// < 255 anywhere). PNG/WEBP/GIF can all carry an alpha channel without
// using it, so we check real pixel data rather than trusting the file
// type - a flat-opaque PNG should still get the dark portrait box.
function detectTransparency(dataUrl) {
  return new Promise(resolve => {
    if (!dataUrl) { resolve(false); return; }
    const img = new Image();
    img.onload = () => {
      try {
        const canvas = document.createElement('canvas');
        // Downsample for speed - alpha presence doesn't depend on
        // resolution, and portraits can be large uploaded photos.
        const w = canvas.width = Math.max(1, Math.min(img.naturalWidth || img.width || 1, 200));
        const h = canvas.height = Math.max(1, Math.min(img.naturalHeight || img.height || 1, 200));
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const { data } = ctx.getImageData(0, 0, w, h);
        for (let i = 3; i < data.length; i += 4) {
          if (data[i] < 255) { resolve(true); return; }
        }
        resolve(false);
      } catch (err) {
        // e.g. a tainted canvas - assume opaque rather than failing.
        console.warn('Could not inspect photo for transparency:', err);
        resolve(false);
      }
    };
    img.onerror = () => resolve(false);
    img.src = dataUrl;
  });
}

// Recreates the dot-screen duotone look of the in-game Staff ID
// portraits (sampled from the source video: a warm khaki paper tone
// with dark warm-black ink dots) from an arbitrary uploaded photo.
// Works on a downscaled copy for a consistent, print-like dot pitch
// regardless of the source photo's resolution, and treats each cell's
// average alpha as its own opacity - so a photo that's already a
// transparent cutout stays transparent here too, rather than gaining
// a solid dot grid over empty areas.
const HALFTONE_LIGHT = '#c9c4ab';
const HALFTONE_DARK = '#2b2620';
const HALFTONE_CELL = 6;

function applyHalftoneEffect(dataUrl) {
  return new Promise(resolve => {
    if (!dataUrl) { resolve(null); return; }
    const img = new Image();
    img.onload = () => {
      try {
        const srcW = img.naturalWidth || img.width || 1;
        const srcH = img.naturalHeight || img.height || 1;
        const targetW = 400;
        const targetH = Math.max(1, Math.round(targetW * srcH / srcW));

        const srcCanvas = document.createElement('canvas');
        srcCanvas.width = targetW;
        srcCanvas.height = targetH;
        const srcCtx = srcCanvas.getContext('2d');
        srcCtx.drawImage(img, 0, 0, targetW, targetH);
        const { data } = srcCtx.getImageData(0, 0, targetW, targetH);

        const outCanvas = document.createElement('canvas');
        outCanvas.width = targetW;
        outCanvas.height = targetH;
        const ctx = outCanvas.getContext('2d');

        for (let y = 0; y < targetH; y += HALFTONE_CELL) {
          const ch = Math.min(HALFTONE_CELL, targetH - y);
          for (let x = 0; x < targetW; x += HALFTONE_CELL) {
            const cw = Math.min(HALFTONE_CELL, targetW - x);
            let lumSum = 0, alphaSum = 0, count = 0;
            for (let cy = 0; cy < ch; cy++) {
              for (let cx = 0; cx < cw; cx++) {
                const i = ((y + cy) * targetW + (x + cx)) * 4;
                const a = data[i + 3];
                lumSum += (0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]) * (a / 255);
                alphaSum += a;
                count++;
              }
            }
            const avgAlpha = alphaSum / count / 255;
            if (avgAlpha < 0.03) continue;
            const avgLum = lumSum / count;

            ctx.globalAlpha = avgAlpha;
            ctx.fillStyle = HALFTONE_LIGHT;
            ctx.fillRect(x, y, cw, ch);

            // Darker source pixels get a bigger ink dot, exactly like a
            // real halftone printing screen - a small overlap allowance
            // at full black lets shadows read as solid rather than
            // capping out at visibly separated dots.
            const darkness = 1 - (avgLum / 255);
            const maxRadius = (HALFTONE_CELL / 2) * 1.15;
            const radius = maxRadius * Math.sqrt(darkness);
            if (radius > 0.15) {
              ctx.fillStyle = HALFTONE_DARK;
              ctx.beginPath();
              ctx.arc(x + cw / 2, y + ch / 2, radius, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        }
        ctx.globalAlpha = 1;
        resolve(outCanvas.toDataURL('image/png'));
      } catch (err) {
        // e.g. a tainted canvas - fall back to the unprocessed photo
        // rather than losing the portrait entirely.
        console.warn('Halftone processing failed, using original photo:', err);
        resolve(dataUrl);
      }
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

// Single entry point for setting the portrait photo, so transparency
// detection always runs and every caller (dropzone, drag-and-drop,
// restored-from-storage) stays consistent.
// Recomputes profileImgDisplay from the current raw profileImg and the
// halftoneEnabled toggle - called both when the photo itself changes
// and when the toggle changes, so switching the setting takes effect
// immediately on whatever photo is already loaded, not just future
// uploads.
function refreshProfileDisplay() {
  const raw = profileImg.val;
  if (!raw) { profileImgDisplay.val = null; return; }
  if (!halftoneEnabled.val) { profileImgDisplay.val = raw; return; }
  applyHalftoneEffect(raw).then(processedUrl => {
    // Guard against staleness: only apply if this is still the current
    // photo and the toggle hasn't been flipped back off while this was
    // processing.
    if (profileImg.val === raw && halftoneEnabled.val) profileImgDisplay.val = processedUrl;
  });
}

function setProfileImage(dataUrl) {
  profileImg.val = dataUrl || null;
  if (!dataUrl) {
    profileImgDisplay.val = null;
    portraitHasTransparency.val = false;
    return;
  }
  detectTransparency(dataUrl).then(hasAlpha => {
    // Guard against a stale result if the photo changed again while
    // this was still being inspected.
    if (profileImg.val === dataUrl) portraitHasTransparency.val = hasAlpha;
  });
  refreshProfileDisplay();
}

// Single entry point for removing the portrait photo - always restores
// the dark photo box alongside clearing the image itself.
function clearProfileImage() {
  setProfileImage(null);
}

// Hidden <input type=file> behind the portrait box. Clicking the portrait
// opens the device's file/photo picker (photo library, camera roll, or
// file storage depending on the platform); the chosen image goes through
// the same loadImageFile() path as drag-and-drop and the editor dropzone.
let portraitFileInput = null;
function openPortraitPicker() {
  if (!portraitFileInput) {
    portraitFileInput = document.createElement('input');
    portraitFileInput.type = 'file';
    portraitFileInput.accept = 'image/*';
    portraitFileInput.style.display = 'none';
    portraitFileInput.addEventListener('change', () => {
      const file = portraitFileInput.files && portraitFileInput.files[0];
      loadImageFile(file);
      // Clear so picking the same file again still fires 'change'.
      portraitFileInput.value = '';
    });
    document.body.appendChild(portraitFileInput);
  }
  portraitFileInput.click();
}

// Shared by the sidebar dropzone widget and drag-and-drop directly
// onto the card's portrait. Routing through dropzoneInstance.addFile
// (when it's available) keeps both UIs in sync - the editor dialog's
// thumbnail preview will show whatever was dropped on the card, and
// vice versa. Falls back to a plain FileReader for the brief window
// before the dropzone widget has initialized.
function loadImageFile(file) {
  if (!file || !file.type || !file.type.startsWith('image/')) return;
  if (dropzoneInstance) {
    dropzoneInstance.addFile(file);
  } else {
    const reader = new FileReader();
    reader.onload = e => { setProfileImage(e.target.result); };
    reader.readAsDataURL(file);
  }
}

function setupDropzone(container) {
  const dz = new Dropzone(container, {
    url: '#',
    autoProcessQueue: false,
    maxFiles: 1,
    acceptedFiles: 'image/*',
    addRemoveLinks: true,
    dictDefaultMessage: 'Drop a profile photo here or click to upload',
  });
  dz.on('addedfile', file => {
    if (dz.files.length > 1) {
      dz.removeFile(dz.files[0]);
    }
    const reader = new FileReader();
    reader.onload = e => { setProfileImage(e.target.result); };
    reader.readAsDataURL(file);
  });
  dz.on('removedfile', () => {
    if (dz.files.length === 0) clearProfileImage();
  });
  dropzoneInstance = dz;
  return dz;
}

// ---------- reset ----------

function resetCard() {
  const confirmed = window.confirm(
    'Reset this card to its default template? This clears every field, including your saved data, and cannot be undone.'
  );
  if (!confirmed) return;

  codename.val = DEFAULT_CODENAME;
  clsPart.val = DEFAULT_CLASS;
  rolePart.val = DEFAULT_ROLE;
  pronounsPart.val = DEFAULT_PRONOUNS;
  life.val = DEFAULT_LIFE;
  psyche.val = DEFAULT_PSYCHE;
  gmp.val = DEFAULT_GMP;
  quote.val = DEFAULT_QUOTE;
  ticker.val = DEFAULT_TICKER;
  DEFAULT_SKILLS.forEach((v, i) => {
    if (!skills[i]) return;
    skills[i].icon.val = v.icon;
    skills[i].name.val = v.name;
  });

  // Replace the parameter list wholesale (restores the original count
  // even if rows were added/removed), then explicitly refresh the
  // dialog's imperatively-managed rows to match - they don't watch
  // paramsList reactively (see ParamsEditorSection), so without this
  // they'd keep showing the old, now-orphaned parameter objects.
  paramsList.val = createDefaultParams();
  if (resyncParamsEditor) resyncParamsEditor();
  pixelIconMode.val = true;
  DEFAULT_SICKNESSES.forEach((v, i) => {
    if (sicknesses[i]) sicknesses[i].val = v;
  });

  clearProfileImage();
  halftoneEnabled.val = false;
  if (dropzoneInstance) {
    try { dropzoneInstance.removeAllFiles(true); } catch (err) { /* no files to remove */ }
  }

  try { localStorage.removeItem(STORAGE_KEY); } catch (err) { /* ignore */ }
}

// Checkbox for the emoji/pixel-art toggle. Kept in sync with
// pixelIconMode even when it changes elsewhere (e.g. RESET CARD),
// mirroring the pattern used by numberInput/textInput above.
function pixelIconCheckbox() {
  const el = input({
    type: 'checkbox', checked: pixelIconMode.val,
    onchange: e => { pixelIconMode.val = e.target.checked; },
  });
  van.derive(() => {
    const v = pixelIconMode.val;
    if (el.checked !== v) el.checked = v;
  });
  return el;
}

// Checkbox for the halftone effect toggle. Mirrors pixelIconCheckbox
// above (kept in sync with halftoneEnabled even when it changes
// elsewhere, e.g. RESET CARD), but also re-derives the currently
// loaded photo on change via refreshProfileDisplay() so flipping the
// toggle takes effect immediately rather than only on the next upload.
function halftoneCheckbox() {
  const el = input({
    type: 'checkbox', checked: halftoneEnabled.val,
    onchange: e => { halftoneEnabled.val = e.target.checked; refreshProfileDisplay(); },
  });
  van.derive(() => {
    const v = halftoneEnabled.val;
    if (el.checked !== v) el.checked = v;
  });
  return el;
}

// ---------- PNG export ----------

function safeFileName(name) {
  const cleaned = String(name || '').trim().replace(/[^a-z0-9_\- ]+/gi, '').trim().replace(/\s+/g, '_');
  return cleaned || 'card';
}

// A skill slot is "untouched" for export purposes if its name is
// either blank or still exactly the seeded default text (currently
// only slot 1 ships with a non-empty default, "Skill Name 1", but
// this checks every slot against its own DEFAULT_SKILLS entry so it
// keeps working if that ever changes). For an untouched slot, both
// the name text (real text or the empty-state "Skill N" placeholder)
// and the icon (emoji or pixel-art) get hidden - but only in the
// exported PNG; the live card keeps showing them so the user still
// knows those slots are editable.
function markUntouchedSkillsForExport(hide) {
  const nameEls = document.querySelectorAll('.skill-name-text');
  const iconEls = document.querySelectorAll('.skill-icon-el');
  nameEls.forEach((el, i) => {
    const current = skills[i] ? skills[i].name.val : '';
    const defaultVal = DEFAULT_SKILLS[i] ? DEFAULT_SKILLS[i].name : '';
    const untouched = current.trim() === '' || current === defaultVal;
    el.classList.toggle('export-hide-text', hide && untouched);
    if (iconEls[i]) iconEls[i].classList.toggle('export-hide-text', hide && untouched);
  });
}

// Same idea as markUntouchedSkillsForExport, for the quote/bio
// description box: its placeholder/default text is hidden in the
// exported PNG whenever it's blank or still exactly the seeded
// default text, but the box itself (dark background/frame) stays
// visible either way - only the text color is toggled, not the whole
// element - and the live card is left untouched so the user can still
// see (and click into) it.
function markUntouchedQuoteForExport(hide) {
  const el = document.querySelector('.quote-box');
  if (!el) return;
  const untouched = quote.val.trim() === '' || quote.val === DEFAULT_QUOTE;
  el.classList.toggle('export-hide-quote-text', hide && untouched);
}

async function downloadCardPng(triggerBtn) {
  const cardEl = document.querySelector('.paper');
  if (!cardEl || typeof modernScreenshot === 'undefined') {
    console.error('modern-screenshot not available or .paper not found');
    return;
  }
  if (triggerBtn) triggerBtn.disabled = true;
  markUntouchedSkillsForExport(true);
  markUntouchedQuoteForExport(true);
  drawAllSickHatches();
  // The scrolling ticker tape is a live/animated UI affordance, not
  // part of the "portrait" look of the card - hide it just for the
  // capture (restored in the finally block either way) rather than
  // freezing it mid-scroll into the exported image.
  const tickerEl = document.querySelector('.ticker-tape');
  const prevTickerDisplay = tickerEl ? tickerEl.style.display : null;
  if (tickerEl) tickerEl.style.display = 'none';
  // If applyMobileScale() has shrunk .paper with a CSS transform (see
  // near the bottom of this file), undo that just for the capture -
  // the screenshot should render the card at its real, full 1280px design
  // resolution regardless of how small the phone screen it's being
  // exported from is. Restored in the finally block either way.
  const hadTransform = !!cardEl.style.transform;
  const prevTransform = cardEl.style.transform;
  const prevWidth = cardEl.style.width;
  const prevMaxWidth = cardEl.style.maxWidth;
  if (hadTransform) {
    cardEl.style.transform = '';
    cardEl.style.width = '1280px';
    cardEl.style.maxWidth = 'none';
  }
  try {
    const canvas = await modernScreenshot.domToCanvas(cardEl, {
      scale: 2,
      // The LIFE/PSYCHE/GMP+ values are <input type="number">, and the
      // ::-webkit-inner-spin-button rule that hides their spinner isn't
      // carried into the screenshot's clone (only computed styles are),
      // so the spinner would eat width and clip the last digit. Plain
      // text inputs have no spinner; only the clone is changed.
      onCloneEachNode: (node) => {
        if (node instanceof HTMLInputElement && node.type === 'number') node.type = 'text';
      },
    });
    const dataUrl = canvas.toDataURL('image/png');
    const link = document.createElement('a');
    link.download = `${safeFileName(codename.val)}.png`;
    link.href = dataUrl;
    document.body.appendChild(link);
    link.click();
    link.remove();
  } catch (err) {
    console.error('Failed to export card as PNG:', err);
  } finally {
    markUntouchedSkillsForExport(false);
    markUntouchedQuoteForExport(false);
    if (tickerEl) tickerEl.style.display = prevTickerDisplay;
    if (hadTransform) {
      cardEl.style.transform = prevTransform;
      cardEl.style.width = prevWidth;
      cardEl.style.maxWidth = prevMaxWidth;
    }
    if (triggerBtn) triggerBtn.disabled = false;
  }
}

function DownloadButton() {
  const btn = button({
    class: 'download-btn',
    'aria-label': 'Download card as PNG',
    title: 'Download card as PNG',
    onclick: (e) => downloadCardPng(e.currentTarget),
  }, '\u2913');
  return btn;
}
