// ---------- PNG export ----------

function safeFileName(name) {
  const cleaned = String(name || '').trim().replace(/[^a-z0-9_\- ]+/gi, '').trim().replace(/\s+/g, '_');
  return cleaned || 'card';
}

// A skill slot is "untouched" for export purposes if its name is
// either blank or still exactly the seeded default text (currently
// only slot 1 ships with a non-empty default, "Skill Name 1", but
// this checks every slot against its own DEFAULT_SKILLS entry so it
// keeps working if that ever changes). For an untouched slot, both
// the name text (real text or the empty-state "Skill Name N" placeholder)
// and the icon (emoji or pixel-art) get hidden - but only in the
// exported PNG; the live card keeps showing them so the user still
// knows those slots are editable.
function markUntouchedSkillsForExport(hide) {
  const nameEls = document.querySelectorAll('.skill-name-text');
  const iconEls = document.querySelectorAll('.skill-icon-el');
  nameEls.forEach((el, i) => {
    const current = skills[i] ? skills[i].name.val : '';
    const defaultVal = DEFAULT_SKILLS[i] ? DEFAULT_SKILLS[i].name : '';
    const untouched = current.trim() === '' || current === defaultVal;
    el.classList.toggle('export-hide-text', hide && untouched);
    if (iconEls[i]) iconEls[i].classList.toggle('export-hide-text', hide && untouched);
  });
}

// Same idea as markUntouchedSkillsForExport, for the ABOUT ME
// description box: its placeholder/default text is hidden in the
// exported PNG whenever it's blank or still exactly the seeded
// default text, but the box itself (dark background/frame) stays
// visible either way - only the text color is toggled, not the whole
// element - and the live card is left untouched so the user can still
// see (and click into) it.
function markUntouchedQuoteForExport(hide) {
  const el = document.querySelector('.quote-box');
  if (!el) return;
  const untouched = quote.val.trim() === '' || quote.val === DEFAULT_QUOTE;
  el.classList.toggle('export-hide-quote-text', hide && untouched);
}

// ---------- uncompressed PNG encoder ----------
// canvas.toDataURL()/toBlob() always deflate-compress the PNG and offer no way to choose the level. This writes
// the PNG by hand with the deflate stream made only of "stored" (level 0, no compression) blocks, so the file
// holds the raw pixels exactly as the canvas has them. (PNG is lossless either way; this just also skips the
// compression step. The file is larger: about 15 MB for the 2560x1462 card.)
const PNG_CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function pngCrc32(bytes, start, end) {
  let c = 0xFFFFFFFF;
  for (let i = start; i < end; i++) c = PNG_CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function encodeUncompressedPng(canvas) {
  const w = canvas.width, h = canvas.height;
  const px = canvas.getContext('2d').getImageData(0, 0, w, h).data;
  const rowLen = w * 4;
  const rawLen = h * (rowLen + 1);
  const raw = new Uint8Array(rawLen);
  for (let y = 0; y < h; y++) {
    raw[y * (rowLen + 1)] = 0; // filter type 0 (None)
    raw.set(px.subarray(y * rowLen, (y + 1) * rowLen), y * (rowLen + 1) + 1);
  }
  // zlib stream: header + stored blocks (max 65535 bytes each) + Adler-32
  const MAXB = 65535;
  const nBlocks = Math.max(1, Math.ceil(rawLen / MAXB));
  const z = new Uint8Array(2 + rawLen + nBlocks * 5 + 4);
  let zi = 0;
  z[zi++] = 0x78; z[zi++] = 0x01;
  for (let b = 0, off = 0; b < nBlocks; b++) {
    const len = Math.min(MAXB, rawLen - off);
    z[zi++] = (b === nBlocks - 1) ? 1 : 0;
    z[zi++] = len & 0xFF; z[zi++] = len >>> 8;
    z[zi++] = (~len) & 0xFF; z[zi++] = ((~len) >>> 8) & 0xFF;
    z.set(raw.subarray(off, off + len), zi);
    zi += len; off += len;
  }
  let a = 1, bsum = 0;
  for (let i = 0; i < rawLen; ) {
    const end = Math.min(i + 5552, rawLen);
    for (; i < end; i++) { a += raw[i]; bsum += a; }
    a %= 65521; bsum %= 65521;
  }
  const adler = ((bsum << 16) | a) >>> 0;
  z[zi++] = adler >>> 24; z[zi++] = (adler >>> 16) & 0xFF; z[zi++] = (adler >>> 8) & 0xFF; z[zi++] = adler & 0xFF;
  // PNG file
  const sig = [137, 80, 78, 71, 13, 10, 26, 10];
  const out = new Uint8Array(8 + (12 + 13) + (12 + z.length) + 12);
  const dv = new DataView(out.buffer);
  let o = 0;
  out.set(sig, o); o += 8;
  const chunk = (type, data) => {
    dv.setUint32(o, data.length); o += 4;
    const start = o;
    for (let i = 0; i < 4; i++) out[o++] = type.charCodeAt(i);
    out.set(data, o); o += data.length;
    dv.setUint32(o, pngCrc32(out, start, o)); o += 4;

  const ih = new DataView(ihdr.buffer);
  ih.setUint32(0, w); ih.setUint32(4, h);
  ihdr[8] = 8; ihdr[9] = 6; ihdr[10] = 0; ihdr[11] = 0; ihdr[12] = 0; // 8-bit RGBA, no interlace
  chunk('IHDR', ihdr);
  chunk('IDAT', z);
  chunk('IEND', new Uint8Array(0));

}

async function downloadCardPng(triggerBtn) {
  const cardEl = document.querySelector('.paper');
  if (!cardEl || typeof modernScreenshot === 'undefined') {
    console.error('modern-screenshot not available or .paper not found');
    return;
  }
  if (triggerBtn) triggerBtn.disabled = true;
  markUntouchedSkillsForExport(true);
  markUntouchedQuoteForExport(true);
  drawAllSickHatches();
  // The scrolling ticker tape is a animated UI overlay, not
  // part of the card - Its hidden for the
  // capture (restored in the finally block either way) rather than
  // freezing it mid-scroll into the exported image.
  const tickerEl = document.querySelector('.ticker-tape');
  const prevTickerDisplay = tickerEl ? tickerEl.style.display : null;
  if (tickerEl) tickerEl.style.display = 'none';
  // If applyMobileScale() has shrunk .paper with a CSS transform (see
  // near the bottom of this file), undo that just for the capture -
  // the screenshot should render the card at its real, full 1280px design
  // resolution regardless of how small the phone screen it's being
  // exported from is. Restored in the finally block either way.
  // The editor's fit-to-window preview scales .paper-scale-wrap; capture at full size and put it back afterwards.
  const fitWrap = document.querySelector('.paper-scale-wrap');
  const prevFitTransform = fitWrap ? fitWrap.style.transform : '';
  if (fitWrap) fitWrap.style.transform = '';
  const hadTransform = !!cardEl.style.transform;
  const prevTransform = cardEl.style.transform;
  const prevWidth = cardEl.style.width;
  const prevMaxWidth = cardEl.style.maxWidth;
  if (hadTransform) {
    cardEl.style.transform = '';
    cardEl.style.width = '1280px';
    cardEl.style.maxWidth = 'none';
  }
  // Make sure the Peace Walker font is really loaded and no bar is mid-transition before the clone is taken,
  // and capture at an exact, fixed size so every browser produces the same 2560x1462 image.
  cardEl.classList.add('exporting');
  // Pixel-art icons: work out a size that is a whole number of half-CSS-px per icon pixel (whole device px at 2x)
  // so no browser resamples at a fractional scale. Only icons that are already within 4% of such a size are
  // nudged, and only inside the screenshot's clone (see onCloneEachNode below) - the live card is never touched.
  const iconSnaps = [...cardEl.querySelectorAll('svg.pixel-icon-svg')].map(svg => {
    const vb = svg.viewBox && svg.viewBox.baseVal;
    const r = svg.getBoundingClientRect();
    if (!vb || !vb.width || !vb.height || !r.width) return null;
    const cur = r.width / vb.width;
    const cell = Math.max(0.5, Math.round(cur * 2) / 2);
    if (Math.abs(cell - cur) / cur > 0.04) return null;
    return { w: vb.width * cell, h: vb.height * cell };
  });
  let iconSnapIdx = 0;
  try {
    if (document.fonts) {
      try { await Promise.all([document.fonts.load('38px "Peace Walker"'), document.fonts.ready]); } catch (e) {}
    }
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    const canvas = await modernScreenshot.domToCanvas(cardEl, {
      scale: 2,
      width: 1280,
      height: 731,
      // The LIFE/PSYCHE/GMP+ values are <input type="number">, and the
      // ::-webkit-inner-spin-button rule that hides their spinner isn't
      // carried into the screenshot's clone (only computed styles are),
      // so the spinner would eat width and clip the last digit. Plain
      // text inputs have no spinner; only the clone is changed.
      onCloneEachNode: (node) => {
        if (node instanceof HTMLInputElement && node.type === 'number') node.type = 'text';
        if (node instanceof SVGSVGElement && node.classList.contains('pixel-icon-svg')) {
          const t = iconSnaps[iconSnapIdx++];
          if (t) { node.style.width = t.w + 'px'; node.style.height = t.h + 'px'; }
        }
      },
    });
    // Level-0 (uncompressed) PNG; falls back to the browser's own encoder if anything goes wrong.
    let href, blobUrl = null;
    try { blobUrl = URL.createObjectURL(encodeUncompressedPng(canvas)); href = blobUrl; }
    catch (encErr) { console.error('Uncompressed PNG failed, using canvas encoder:', encErr); href = canvas.toDataURL('image/png'); }
    const link = document.createElement('a');
    link.download = `${safeFileName(codename.val)}.png`;
    link.href = href;
    document.body.appendChild(link);
    link.click();
    link.remove();
    if (blobUrl) setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);
  } catch (err) {
    console.error('Failed to export card as PNG:', err);
  } finally {
    if (fitWrap) fitWrap.style.transform = prevFitTransform;
    cardEl.classList.remove('exporting');
    markUntouchedSkillsForExport(false);
    markUntouchedQuoteForExport(false);
    if (tickerEl) tickerEl.style.display = prevTickerDisplay;
    if (hadTransform) {
      cardEl.style.transform = prevTransform;
      cardEl.style.width = prevWidth;
      cardEl.style.maxWidth = prevMaxWidth;
    }
    if (triggerBtn) triggerBtn.disabled = false;
  }
}

let tutLayer = null;
let tutEls = null;
let tutIndex = 0;
let tutTimers = [];

function tutCompactEditor() {
  // Same breakpoint the CSS uses to turn the editor into a full-screen panel.
  return window.matchMedia('(max-width: 950px), (hover: none) and (pointer: coarse)').matches;
}

function tutLater(fn, ms) { tutTimers.push(setTimeout(fn, ms)); }

function tutBuild() {
  const mk = (tag, cls, txt) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
  };
  const layer = mk('div', 'tut-layer');
  layer.setAttribute('role', 'dialog');
  layer.setAttribute('aria-label', 'Tutorial');
  const block = mk('div', 'tut-block');
  const spot = mk('div', 'tut-spot none');
  const arrow = mk('div', 'tut-arrow');
  arrow.innerHTML = '<svg viewBox="0 0 48 28" aria-hidden="true"><path d="M1 9H28V1L47 14L28 27V19H1Z" fill="currentColor" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/></svg>';
  const card = mk('div', 'tut-card');
  const step = mk('div', 'tut-step');
  const title = mk('div', 'tut-title');
  const text = mk('div', 'tut-text');
  const prog = mk('div', 'tut-progress');
  const fill = mk('span');
  prog.appendChild(fill);
  const nav = mk('div', 'tut-nav');
  const skip = mk('button', 'tut-skip', 'SKIP');
  const back = mk('button', 'tut-btn', '\u2190 BACK');
  const next = mk('button', 'tut-btn tut-primary', 'NEXT \u2192');
  [skip, back, next].forEach(b => { b.type = 'button'; });
  skip.onclick = () => tutClose();
  back.onclick = () => tutShow(tutIndex - 1);
  next.onclick = () => tutNext();
  nav.append(skip, back, next);
  card.append(step, title, text, prog, nav);
  layer.append(block, spot, arrow, card);
  return { layer, spot, arrow, card, step, title, text, fill, skip, back, next };
}

function tutOpen() {
  if (tutLayer) return;
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  dialogOpen.val = false;
  tutEls = tutBuild();
  tutLayer = tutEls.layer;
  document.body.appendChild(tutLayer);
  document.addEventListener('keydown', tutKey, true);
  window.addEventListener('resize', tutOnResize);
  tutShow(0);
}

function tutClose() {
  if (!tutLayer) return;
  tutTimers.forEach(clearTimeout);
  tutTimers = [];
  document.removeEventListener('keydown', tutKey, true);
  window.removeEventListener('resize', tutOnResize);
  tutLayer.remove();
  tutLayer = null;
  tutEls = null;
  dialogOpen.val = false;
}

function tutNext() {
  if (tutIndex >= TUTORIAL_STEPS.length - 1) tutClose();
  else tutShow(tutIndex + 1);
}

function tutKey(e) {
  if (!tutLayer) return;
  if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); tutClose(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); e.stopPropagation(); tutNext(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); e.stopPropagation(); if (tutIndex > 0) tutShow(tutIndex - 1); }
}

function tutOnResize() {
  requestAnimationFrame(() => requestAnimationFrame(tutPosition));
}

function tutShow(i) {
  if (!tutLayer) return;
  tutTimers.forEach(clearTimeout);
  tutTimers = [];
  const n = TUTORIAL_STEPS.length;
  tutIndex = clamp(i, 0, n - 1);
  const st = TUTORIAL_STEPS[tutIndex];
  const e = tutEls;
  e.step.textContent = `STEP ${String(tutIndex + 1).padStart(2, '0')} / ${String(n).padStart(2, '0')}`;
  e.title.textContent = st.title;
  e.text.textContent = st.text;
  e.fill.style.width = `${((tutIndex + 1) / n) * 100}%`;
  e.back.hidden = tutIndex === 0;
  e.next.textContent = tutIndex === n - 1 ? 'FINISH' : 'NEXT \u2192';
  e.skip.style.visibility = tutIndex === n - 1 ? 'hidden' : 'visible';
  e.card.classList.remove('in');
  void e.card.offsetWidth; // restart the fade-in animation
  e.card.classList.add('in');
  e.arrow.style.opacity = '0';

  const wantEditor = !!st.editor;
  if (dialogOpen.val !== wantEditor) {
    dialogOpen.val = wantEditor;
    tutLater(tutSettle, wantEditor ? 420 : 80); // let the editor finish sliding in / out
  } else {
    tutSettle();
  }
  e.next.focus({ preventScroll: true });
}

function tutSettle() {
  if (!tutLayer) return;
  const st = TUTORIAL_STEPS[tutIndex];
  if (st.editor) {
    // Scroll the editor so the section being explained starts at the top of the panel.
    const body = document.querySelector('.editor-body');
    const el = document.querySelector(st.sel);
    if (body && el) body.scrollTop += el.getBoundingClientRect().top - body.getBoundingClientRect().top - 8;
  }
  tutPosition();
  tutLater(tutPosition, 120);
  tutLater(() => { if (tutEls) { tutPosition(); tutEls.arrow.style.opacity = '1'; } }, 380);
}

// A step highlights either one element (`sel`) or the combined box of several (`els`).
function tutTargetRect(st) {
  const list = st.els ? st.els().filter(Boolean) : [document.querySelector(st.sel || '.tut-none')].filter(Boolean);
  let r = null;
  for (const el of list) {
    const b = el.getBoundingClientRect();
    if (b.width < 1 && b.height < 1) continue;
    r = r ? { left: Math.min(r.left, b.left), top: Math.min(r.top, b.top), right: Math.max(r.right, b.right), bottom: Math.max(r.bottom, b.bottom) }
          : { left: b.left, top: b.top, right: b.right, bottom: b.bottom };
  }
  if (r) { r.width = r.right - r.left; r.height = r.bottom - r.top; }
  return r;
}

function tutPosition() {
  if (!tutLayer) return;
  const { spot, arrow, card } = tutEls;
  const st = TUTORIAL_STEPS[tutIndex];
  const vw = window.innerWidth, vh = window.innerHeight;
  const cw = card.offsetWidth, ch = card.offsetHeight;
  const place = (left, top) => { card.style.left = `${Math.round(left)}px`; card.style.top = `${Math.round(top)}px`; };

  const r = tutTargetRect(st);
  if (!r || (r.width < 2 && r.height < 2)) {
    // Title slide (or the feature is missing): dim everything and centre the card.
    spot.classList.add('none');
    spot.style.left = `${vw / 2}px`; spot.style.top = `${vh / 2}px`;
    spot.style.width = '0px'; spot.style.height = '0px';
    arrow.style.display = 'none';
    place((vw - cw) / 2, (vh - ch) / 2);
    return;
  }

  // Glowing box around the feature, kept inside the window.
  const PAD = 6;
  const L = Math.max(3, r.left - PAD), T = Math.max(3, r.top - PAD);
  const R = Math.min(vw - 3, r.right + PAD), B = Math.min(vh - 3, r.bottom + PAD);
  spot.classList.remove('none');
  spot.style.left = `${L}px`; spot.style.top = `${T}px`;
  spot.style.width = `${R - L}px`; spot.style.height = `${B - T}px`;

  const cx = (L + R) / 2, cy = (T + B) / 2;
  const GAP = 64, M = 12; // GAP leaves room for the arrow between the box and the card
  const space = { below: vh - B - M, above: T - M, right: vw - R - M, left: L - M };
  const need = { below: ch + GAP, above: ch + GAP, right: cw + GAP, left: cw + GAP };

  // Pick the side with the most spare room. On the full-screen editor (phones / tablets) the card docks instead.
  let dir = null, best = -Infinity;
  if (!(st.editor && tutCompactEditor())) {
    for (const d of ['below', 'above', 'right', 'left']) {
      const slack = space[d] - need[d];
      if (slack >= 0 && slack > best) { best = slack; dir = d; }
    }
  }

  if (!dir) {
    // Nowhere to put both card and arrow: dock the card to the far edge and rely on the glowing box.
    arrow.style.display = 'none';
    place((vw - cw) / 2, cy < vh * 0.55 ? vh - ch - 10 : 10);
    return;
  }

  const arrowAt = (x, y, deg) => {
    arrow.style.display = 'block';
    arrow.style.left = `${x}px`; arrow.style.top = `${y}px`;
    arrow.style.transform = `rotate(${deg}deg)`;
  };
  if (dir === 'below' || dir === 'above') {
    const left = clamp(cx - cw / 2, M, vw - cw - M);
    place(left, dir === 'below' ? B + GAP : T - GAP - ch);
    let ax = clamp(cx, left + 30, left + cw - 30);
    ax = (R - L > 24) ? clamp(ax, L + 12, R - 12) : cx;
    arrowAt(ax, dir === 'below' ? B + 28 : T - 28, dir === 'below' ? -90 : 90);
  } else {
    const top = clamp(cy - ch / 2, M, vh - ch - M);
    place(dir === 'right' ? R + GAP : L - GAP - cw, top);
    let ay = clamp(cy, top + 26, top + ch - 26);
    ay = (B - T > 24) ? clamp(ay, T + 12, B - 12) : cy;
    arrowAt(dir === 'right' ? R + 28 : L - 28, ay, dir === 'right' ? 180 : 0);
  }
}

function TutorialButton() {
  return button({
    class: 'tutorial-btn',
    'aria-label': 'Tutorial: how to use this tool',
    title: 'Tutorial: how to use this tool',
    onclick: () => tutOpen(),
  }, '?');
}

function EditorUI() {
  // Build the overlay + dialog exactly once. Toggling `dialogOpen`
  // must never recreate these nodes - Dialog() reads many fields'
  // .val synchronously while building the form (to set each input's
  // initial value), so if it were rebuilt inside a reactive binding
  // that also depends on those fields, every keystroke in any field
  // would tear down and rebuild the whole dialog, killing focus.
  // Instead we mount it once and only flip a `display` style, which
  // is a leaf-level binding depending on dialogOpen alone.
  const modalWrap = div(
    {
      class: 'editor-modal-wrap',
      style: () => dialogOpen.val ? '' : 'display:none;',
    },
    div({ class: 'editor-overlay', onclick: () => { dialogOpen.val = false; } }),
    Dialog(),
  );

  return div({},
    button({
      class: 'hamburger-btn',
      'aria-label': 'Edit card',
      onclick: () => { dialogOpen.val = true; },
    }, span({}), span({}), span({})),
    DownloadButton(),
    DiscordButton(),
    InstagramButton(),
    LinktreeButton(),
    TutorialButton(),
    modalWrap,
  );
}

// ---------- mount ----------
// NOTE: Card() and EditorUI() are mounted as plain (already-built) DOM
// nodes, not as `() => Card()` / `() => EditorUI()` reactive wrappers.
// Both functions already do their fine-grained reactive binding
// internally (every dynamic bit is a nested `() => state.val` child or
// prop, which VanJS binds in isolation). Wrapping the whole call in a
// function here would instead make VanJS treat *every* van.state read
// anywhere during that single build as a dependency of the entire
// returned subtree - so e.g. typing into the codename field would
// destroy and recreate the whole editor dialog (and any focused
// input inside it) on every keystroke.
// The sicknesses row's diagonal hatch pattern is drawn on plain
// <canvas> elements rather than via a CSS repeating-linear-gradient
// background. html2canvas's gradient renderer is unreliable across
// versions/edge-cases (custom-property backgrounds, "hard" color
// stops at identical positions, etc.) and the hatch kept exporting
// blank no matter how the gradient CSS was written. Copying pixels
// from a live <canvas> element, by contrast, is one of html2canvas's
// most solid, well-tested code paths, so we draw the pattern
// ourselves once with the 2D canvas API and let html2canvas just
// copy the bitmap as-is.
function drawSickHatch(canvasEl) {
  // Size from the always-visible parent cell (clientWidth/Height), not
  // from the canvas itself: the canvas is display:none whenever the
  // sickness has a value, and a hidden element reports 0x0 - which used
  // to leave a 1x1 bitmap that stretched into a solid black cell the
  // next time the value dropped back to zero. clientWidth/Height also
  // ignore the mobile-scale transform, unlike getBoundingClientRect().
  const parent = canvasEl.parentElement;
  const w = parent ? Math.round(parent.clientWidth) : 0;
  const h = parent ? Math.round(parent.clientHeight) : 0;
  if (w < 2 || h < 2) return; // not laid out yet - a later redraw will handle it
  // Fixed 4x oversample (independent of the screen's devicePixelRatio) and per-pixel maths instead of
  // rotated, anti-aliased fillRects: every browser now produces exactly the same stripes. 2px near-black
  // lines running "/" with an 8px vertical pitch (2.83px thick vertically = 2px perpendicular).
  const S = 4;
  canvasEl.width = w * S;
  canvasEl.height = h * S;
  const ctx = canvasEl.getContext('2d');
  const W = w * S, H = h * S;
  const img = ctx.createImageData(W, H);
  const d = img.data;
  const baseA = khakiEnabled.val ? 255 : 0; // khaki base follows the khaki toggle
  const period = 8 * S, thick = Math.round(2.83 * S);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      if (((x + y) % period) < thick) { d[i] = 26; d[i + 1] = 26; d[i + 2] = 18; d[i + 3] = 255; }
      else { d[i] = 179; d[i + 1] = 179; d[i + 2] = 155; d[i + 3] = baseA; }
    }
  }
  ctx.putImageData(img, 0, 0);
}

function drawAllSickHatches() {
  document.querySelectorAll('canvas.sick-cell-hatch').forEach(drawSickHatch);
}

window.addEventListener('resize', drawAllSickHatches);
// Repaint the hatch cells' khaki base whenever the toggle changes.
van.derive(() => { khakiEnabled.val; requestAnimationFrame(drawAllSickHatches); });

// ---------- mobile scaling ----------
// .paper is a fixed 1280px-wide design (grid columns, em-based font
// sizes, absolute-ish positioning all tuned to that width). Letting it
// simply reflow into a narrow phone viewport via max-width:100% (as it
// does on desktop/tablet) squashes that layout rather than shrinking
// it proportionally - text wraps oddly, columns collide, tap targets
// overlap. Below MOBILE_BREAKPOINT, applyMobileScale() instead renders
// .paper at its full natural 1280px width (so every desktop proportion
// is preserved exactly) and visually scales the whole thing down with
// a CSS transform, like zooming out evenly - identical UI, just
// smaller. .paper-scale-wrap is then given a matching height so the
// page doesn't leave blank space where the unscaled layout used to be.
// Desktop is entirely unaffected: above the breakpoint every inline
// style this sets is cleared, leaving the original CSS (width:1280px;
// max-width:100%; aspect-ratio) in full control, exactly as before.
function applyMobileScale() {
  // The card is never scaled: it is always drawn at its fixed 1280px design size, so window size
  // and browser toolbars can't change how big anything is. All this does is position it:
  //  - centred in the window on whole pixels (a fractional offset makes the pixel font render
  //    with 1px hairline differences), and
  //  - on touch devices it stays top-aligned, so a phone's address bar showing/hiding never
  //    slides the card around.
  // If the window is smaller than the card the offsets are 0 and the page just scrolls.
  const app = document.getElementById('app');
  if (!app) return;
  const CARD_W = 1280, CARD_H = 731, SIDE = 64;
  const root = document.documentElement;
  const wrap = app.querySelector('.paper-scale-wrap');
  // Fit to window: with the editor closed the card is scaled (up or down) to fill the free area of the window; with
  // the editor panel open it is only ever shrunk (never above 100%) to fit beside the panel.
  // The free area leaves out whatever sits on top of the card: the toolbar buttons (top strip on desktop, right
  // strip on narrow windows) or, while editing, the editor panel. Phones/tablets use a full-screen editor that
  // covers the card, so nothing is scaled there while it is open. The transform sits on .paper-scale-wrap, not
  // #app, so the editor panel's fixed positioning is untouched. Exactly 100% leaves the original layout untouched.
  const editing = dialogOpen.val;
  if (wrap && !(editing && tutCompactEditor())) {
    const narrow = window.matchMedia('(max-width: 950px)').matches;
    const dlg = document.querySelector('.editor-dialog');
    const M = 16;
    const resR = editing ? ((dlg && dlg.offsetWidth) || 580) : (narrow ? 60 : 0);
    const resT = (!editing && !narrow) ? 84 : 0;
    const aw = root.clientWidth - 2 * M - resR, ah = root.clientHeight - 2 * M - resT;
    // Menu closed: the card is scaled up or down to fill the window. Editor open: shrink-only (never above 100%).
    const k = Math.max(0.05, Math.min(editing ? 1 : Infinity, aw / CARD_W, ah / CARD_H));
    if (editing || Math.abs(k - 1) > 0.001) {
      root.classList.add('fit-card');
      wrap.style.transform = '';
      wrap.style.transformOrigin = '0 0';
      app.style.margin = '0px';
      window.scrollTo(0, 0);
      const r = wrap.getBoundingClientRect();
      const x = M + Math.max(0, (aw - CARD_W * k) / 2), y = M + resT + Math.max(0, (ah - CARD_H * k) / 2);
      wrap.style.transform = `translate(${Math.round(x - r.left)}px, ${Math.round(y - r.top)}px) scale(${k})`;
      return;
    }
  }
  root.classList.remove('fit-card');
  if (wrap) { wrap.style.transform = ''; wrap.style.transformOrigin = ''; }
  const touch = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
  const mx = Math.max(0, Math.floor((root.clientWidth - 2 * SIDE - CARD_W) / 2));
  const my = touch ? 0 : Math.max(0, Math.floor((root.clientHeight - CARD_H) / 2));
  app.style.margin = my + 'px ' + mx + 'px';
}
window.addEventListener('resize', applyMobileScale);
window.addEventListener('orientationchange', applyMobileScale);
// Refit the card whenever the editor opens or closes (the timeout lets the panel finish showing first).
van.derive(() => { dialogOpen.val; setTimeout(applyMobileScale, 30); });

const app = document.getElementById('app');
van.add(app, div({ class: 'paper-scale-wrap' }, Card()));
van.add(app, EditorUI());
// Draw after layout has actually settled (fonts, flex sizing) rather
// than immediately on append, when getBoundingClientRect() could
// still report stale/zero sizes. Same reasoning applies to the mobile
// scale calculation, which also depends on .paper's settled size.
requestAnimationFrame(() => requestAnimationFrame(() => {
  drawAllSickHatches();
  applyMobileScale();
}));

</script>

</body>
</html>
