function loadSavedState() {
  let raw;
  try {
    raw = localStorage.getItem(STORAGE_KEY);
  } catch (err) {
    // Some browsers throw just for accessing localStorage (e.g. certain
    // private-browsing modes with storage disabled entirely).
    console.warn('localStorage is unavailable; entries will not be remembered between visits:', err);
    return;
  }
  if (!raw) return;

  let data;
  try {
    data = JSON.parse(raw);
  } catch (err) {
    console.warn('Saved character card data was corrupted; starting fresh:', err);
    return;
  }
  if (!data || typeof data !== 'object') return;

  if (typeof data.codename === 'string') codename.val = data.codename.slice(0, CODENAME_MAX);
  if (typeof data.clsPart === 'string') clsPart.val = data.clsPart.slice(0, subtitleRoom(clsPart));
  if (typeof data.rolePart === 'string') rolePart.val = data.rolePart.slice(0, subtitleRoom(rolePart));
  if (typeof data.pronounsPart === 'string') pronounsPart.val = data.pronounsPart.slice(0, subtitleRoom(pronounsPart));
  if (typeof data.life === 'number') life.val = clamp(Math.round(data.life), 0, 9999);
  if (typeof data.psyche === 'number') psyche.val = clamp(Math.round(data.psyche), 0, 9999);
  if (typeof data.gmp === 'number') gmp.val = clamp(Math.round(data.gmp), 0, 999999);
  if (typeof data.halftoneEnabled === 'boolean') halftoneEnabled.val = data.halftoneEnabled;
  if (typeof data.overlay === 'string' && OVERLAY_CHOICES.some(o => o.id === data.overlay)) overlayChoice.val = data.overlay;
  if (typeof data.khakiEnabled === 'boolean') khakiEnabled.val = data.khakiEnabled;
  if (typeof data.profileImg === 'string') setProfileImage(data.profileImg);
  if (typeof data.quote === 'string') quote.val = data.quote.slice(0, QUOTE_MAX);
  if (typeof data.ticker === 'string') ticker.val = data.ticker;
  if (typeof data.pixelIconMode === 'boolean') pixelIconMode.val = data.pixelIconMode;

  if (Array.isArray(data.skills)) {
    data.skills.forEach((val, i) => {
      if (!skills[i]) return;
      if (val && typeof val === 'object') {
        // Current format: separate icon + name fields.
        if (typeof val.icon === 'string') skills[i].icon.val = val.icon;
        if (typeof val.name === 'string') skills[i].name.val = val.name.slice(0, SKILL_NAME_MAX);
      } else if (typeof val === 'string') {
        // Back-compat: older saves stored one combined string (e.g.
        // "⭐ Skill Name"). Best-effort split on the first space so
        // existing saved cards migrate without losing data.
        const spaceIdx = val.indexOf(' ');
        if (spaceIdx === -1) {
          skills[i].icon.val = '';
          skills[i].name.val = val.slice(0, SKILL_NAME_MAX);
        } else {
          skills[i].icon.val = val.slice(0, spaceIdx);
          skills[i].name.val = val.slice(spaceIdx + 1).slice(0, SKILL_NAME_MAX);
        }
      }
    });
  }

  if (Array.isArray(data.paramsList) && data.paramsList.length > 0) {
    // The 13 default slots (Combat ... Defense) are always locked in
    // place, even in cards saved before the lock flag existed: a saved
    // parameter whose icon still matches the default at the same
    // position keeps that fixed slot.
    const defaultSlots = createDefaultParams().filter(d => !d.permanent);
    paramsList.val = data.paramsList.map((p, i) => makeParam(
      typeof p.icon === 'string' ? p.icon : '\u2753',
      clamp(Number(p.percent) || 0, 0, 100),
      !!p.locked || !!p.vacant || (i < defaultSlots.length && p.icon === defaultSlots[i].icon.val),
      !!p.permanent,
      !!p.vacant,
    ));
    // Enforce the slot cap on loaded data (Morale is exempt).
    {
      let seen = 0;
      paramsList.val = paramsList.val.filter(p => p.permanent || ++seen <= MAX_PARAM_SLOTS);
    }
    // Safety net: if an older/edited save somehow lacks Morale, restore it.
    if (!paramsList.val.some(p => p.permanent)) {
      paramsList.val = [...paramsList.val, makeParam(MORALE_ICON_EMOJI, 100, false, true)];
    }
  }

  if (Array.isArray(data.sicknessIcons)) {
    data.sicknessIcons.forEach((v, i) => {
      if (sicknessIcons[i] && typeof v === 'string') sicknessIcons[i].val = v.slice(0, 8);
    });
  }

  if (Array.isArray(data.sicknesses)) {
    data.sicknesses.forEach((v, i) => {
      if (!sicknesses[i]) return;
      sicknesses[i].val = clamp(Number(v) || 0, 0, 99);
    });
  }
}

let saveTimer = null;
function persistNow() {
  clearTimeout(saveTimer);
  const data = collectSerializable();
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (err) {
    // Most commonly a QuotaExceededError - the profile photo is stored
    // as a base64 data URL and can be large. Rather than losing every
    // other edit, retry without the photo so text/stat changes still stick.
    console.warn('Could not save full card (photo too large?); retrying without photo:', err);
    try {
      data.profileImg = null;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (err2) {
      console.warn('Could not save character card to localStorage:', err2);
    }
  }
}
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persistNow, 300);
}

// Flush any pending debounced save when the page is hidden or closed, so
// a change made in the last 300ms before refreshing/leaving isn't lost.
window.addEventListener('pagehide', persistNow);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') persistNow();
});

// Restore any previously-saved entries before the card is first built,
// so the initial render already reflects them.
loadSavedState();

// Auto-save whenever any persisted field changes. Reading every field
// here (via collectSerializable) is what registers them all as this
// derive's dependencies; the actual write happens after a short
// debounce so rapid typing doesn't hit localStorage on every keystroke.
// This has no DOM involvement at all, so it can't cause the
// focus-loss/rebuild issues we ran into elsewhere in this file.
van.derive(() => {
  collectSerializable();
  scheduleSave();
});

// ---------- card display ----------

function StatBar(labelText, valueState) {
  const el = div({ class: 'stat-bar' },
    div({ class: 'stat-fill', style: () => `width:${clamp(valueState.val / 9999 * 100, 0, 100)}%` }),
    div({ class: 'stat-debuff', style: () => {
      const ill = illnessPercent();
      return `width:${ill === null ? 0 : clamp(valueState.val / 9999 * 100, 0, 100) * ill / 100}%`;
    } }),
    div({ class: 'stat-label' }, labelText),
    div({ class: 'stat-value' }, statNumberInput(valueState, 9999, 4, v => {
      // Shown number drops with the illness debuff; editing still changes the base.
      const ill = illnessPercent();
      return ill === null ? v : Math.ceil(v * ill / 100);
    })),
  );
  makeBarDraggable(el, 'horizontal', frac => { valueState.val = clamp(Math.round(frac * 9999), 0, 9999); });
  return el;
}

function ParamCell(p) {
  const el = div({
    class: 'param-cell' + (p.permanent ? ' morale' : ''),
    'data-tip': () => PARAM_ICON_NAMES[p.icon.val] || '',
  },
    div({ class: 'param-fill', style: () => `height:${clamp(Number(p.percent.val) || 0, 0, 100)}%` }),
    div({ class: 'param-debuff', style: () => {
      const ill = illnessPercent();
      if (ill === null || p.permanent) return 'height:0';
      return `height:${effectivePercent(p)}%`;
    } }),
    div({ class: 'param-boost', style: () => {
      const base = clamp(Number(p.percent.val) || 0, 0, 100);
      return `bottom:${base}%;height:${Math.max(0, effectivePercent(p) - base)}%`;
    } }),
    ParamIcon(p),
    span({ class: 'param-grade' }, () => {
      // Morale's rank image is driven purely by its percentage.
      if (p.icon.val === MORALE_ICON_EMOJI) {
        return img({ class: 'morale-rank-img', src: moraleRankImage(p.percent.val), alt: '', draggable: 'false' });
      }
      return gradeFor(effectivePercent(p));
    }),
  );
  makeBarDraggable(el, 'vertical', frac => { p.percent.val = clamp(Math.round(frac * 100), 0, 100); });
  return el;
}

// One column in the SICKNESSES row. Each holds a hatch-pattern canvas
// (drawn by drawSickHatch - see the PNG-export notes near the bottom of
// this file for why it's a <canvas> rather than a CSS gradient) and a
// red fill bar, only one of which is shown at a time:
//   - value === 0  -> hatch canvas visible, bar hidden (the "off" state)
//   - value 1-99   -> bar visible at that height %, hatch hidden
// Every column also gets its (editable) icon from sicknessIcons
// (emoji or pixel-art, matching the global toggle) plus a number
// readout of the current value, styled like a parameter's letter-grade
// text. Both are hidden at value 0 along with the bar - there's
// nothing meaningful to show once that sickness is "off" - and
// reappear together as soon as the value is 1 or higher.
const SICKNESS_LABELS = ['Hostility', 'Sick', 'Wounded', 'PTSD'];

function SicknessCell(i) {
  const state = sicknesses[i];
  const canvasEl = canvas({ class: 'sick-cell-hatch' });
  const barEl = div({
    class: 'sick-cell-bar',
    style: () => {
      const v = clamp(Number(state.val) || 0, 0, 99);
      return `height:${v}%;display:${v > 0 ? 'block' : 'none'}`;
    },
  });
  van.derive(() => {
    const v = clamp(Number(state.val) || 0, 0, 99);
    canvasEl.style.display = v > 0 ? 'none' : 'block';
    // Redraw whenever the hatch becomes visible again, in case it was
    // never (or wrongly) drawn while hidden.
    if (v === 0 && canvasEl.isConnected) drawSickHatch(canvasEl);
  });

  let iconCol = '';
  const iconState = sicknessIcons[i];
  if (iconState) {
    const gradeEl = span({ class: 'sickness-grade' }, () => {
      const v = clamp(Number(state.val) || 0, 0, 99);
      return v > 0 ? String(v) : '';
    });
    iconCol = div({ class: 'sickness-icon-col' }, SicknessIcon(iconState), gradeEl);
    van.derive(() => {
      const v = clamp(Number(state.val) || 0, 0, 99);
      iconCol.style.display = v > 0 ? 'flex' : 'none';
    });
  }

  const wrapEl = div({ class: 'sick-cell-wrap', 'data-tip': SICKNESS_LABELS[i] || '' },
    canvasEl,
    barEl,
    iconCol,
  );
  makeBarDraggable(wrapEl, 'vertical', frac => { state.val = clamp(Math.round(frac * 99), 0, 99); });
  return wrapEl;
}

// The scrolling black bar along the very bottom edge of the card,
// recreated from the gameplay-tip ticker on Peace Walker's actual
// Staff Management screen. Rendered as two back-to-back copies of the
// same text inside a track that animates from translateX(0) to
// translateX(-50%) - since the copies are identical, the moment the
// first one scrolls fully offscreen the second is in exactly the
// position the first started in, so the loop point is invisible and
// it reads as one continuously-scrolling message rather than a
// visible reset/jump. Both copies read reactively from the same
// `ticker` state (fixed at DEFAULT_TICKER - there's no dialog field
// for it, so it isn't user-editable), so if that state ever changes
// both copies update together.
function TickerTape() {
  return div({ class: 'ticker-tape' },
    div({ class: 'ticker-track' },
      span({ class: 'ticker-segment' }, () => ticker.val),
      span({ class: 'ticker-segment' }, () => ticker.val),
    ),
  );
}

function Card() {
  return div({ class: () => 'paper' + (khakiEnabled.val ? '' : ' no-khaki') }, div({ class: () => 'card' + (sicknesses.some(x => (Number(x.val) || 0) > 0) ? ' ill' : '') + (overlayChoice.val !== 'default' ? ` overlay-${overlayChoice.val}` : '') },
    div({ class: 'grid' },

      div({ class: 'portrait-col' },
        div({
          'data-tip': () => profileImgDisplay.val ? 'Click To Change Profile Image' : 'Click To Add Profile Image',
          class: () => 'portrait' + (dragOverPortrait.val ? ' drag-over' : '') + (portraitHasTransparency.val ? ' has-transparency' : '') + (profileImgDisplay.val ? ' has-photo' : '') + (halftoneEnabled.val ? ' halftone-on' : ''),
          style: () => profileImgDisplay.val ? `background-image:url(${profileImgDisplay.val})` : '',
          ondragover: e => { e.preventDefault(); dragOverPortrait.val = true; },
          ondragleave: () => { dragOverPortrait.val = false; },
          onclick: () => openPortraitPicker(),
          ondrop: e => {
            e.preventDefault();
            dragOverPortrait.val = false;
            const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
            loadImageFile(file);
          },
        }),
      ),

      div({ class: 'header-col' },
        div({ class: 'codename' }, editableInline(span, codename, { maxLen: CODENAME_MAX, defaultValue: DEFAULT_CODENAME, placeholder: DEFAULT_CODENAME })),
        div({ class: 'subtitle' },
          ClassField(),
          ' / ',
          RoleField(),
          ' / ',
          PronounsField(),
        ),
        div({ class: 'stats-row' },
          div({ class: 'stat-bars' },
            StatBar('LIFE', life),
            StatBar('PSYCHE', psyche),
          ),
          makeHorizontalValueDrag(
            div({ class: 'gmp-box' },
              div({ class: 'gmp-label' }, 'GMP+'),
              div({ class: 'gmp-value' }, statNumberInput(gmp, 999999, 0)),
            ),
            gmp, 999999,
          ),
        ),
      ),

      div({ class: 'params-and-sick' },
        div({ class: 'params-section' },
          div({ class: 'section-title' }, '<PARAMETERS>'),
          div({ class: 'params-row' }, () => div({ style: 'display:contents' }, ...paramsList.val.filter(p => !p.permanent).map(p => p.vacant ? div({ class: 'param-cell-empty' }) : ParamCell(p)), div({ class: 'param-spacer' }), ...paramsList.val.filter(p => p.permanent).map(p => ParamCell(p)))),
        ),
        div({ class: 'sick-panel' },
          div({ class: 'section-title' }, '<SICKNESSES>'),
          div({ class: 'sick-row' },
            ...sicknesses.map((_, i) => SicknessCell(i)),
          ),
        ),
      ),

      div({ class: 'bottom-section' },
        div({ class: 'skills-title' }, '<SKILLS>'),
        div({ class: 'skills-box' },
          div({ class: 'skills-list' },
            ...skills.map((s, i) => div({ class: 'skill-slot' },
              SkillIcon(s),
              SkillField(s, i))),
          ),
          editableMultiline(div, quote, { extraClass: 'quote-box', defaultValue: DEFAULT_QUOTE, maxLen: QUOTE_MAX, maxRows: QUOTE_MAX_ROWS }),
        ),
      ),
    ),
    TickerTape(),
  ));
}

// ---------- editor dialog ----------

function Field(labelText, el) {
  return div({ class: 'field' }, div({}, labelText), el);
}

// Keeps a number box inside [min, max] as the person types: a value above the max (or below the
// min) is replaced in the box itself right away, not just in the stored state.
function enforceNumberLimit(el, min, max) {
  el.addEventListener('input', () => {
    if (el.value === '') return;
    const n = parseInt(el.value, 10);
    if (isNaN(n)) { el.value = ''; return; }
    const c = clamp(n, min, max);
    if (String(c) !== el.value) el.value = c;
  });
}

function numberInput(state, min, max) {
  const el = input({
    type: 'number', min, max, value: state.val,
    oninput: e => {
      const v = clamp(parseInt(e.target.value, 10) || 0, min, max);
      state.val = v;
    },
  });
  enforceNumberLimit(el, min, max);
  // Reflect changes made elsewhere (e.g. directly on the card via
  // contenteditable) - but only while this field isn't focused, so we
  // never fight the user mid-keystroke or reset the caret.
  van.derive(() => {
    const v = state.val;
    if (document.activeElement !== el && Number(el.value) !== v) el.value = v;
  });
  return el;
}

// The ABOUT ME field in the dialog, built the same way as
// numberInput() above: a plain, uncontrolled textarea whose own typing
// is untouched, plus a derive that pulls in changes made elsewhere
// (e.g. directly on the card's quote box) whenever this field isn't
// the one currently focused. Every other field already followed this
// pattern; this textarea previously didn't, which is what let it and
// the on-card quote box drift out of sync with each other.
function quoteTextarea(state) {
  const el = textarea({
    value: state.val,
    maxlength: QUOTE_MAX,
    rows: QUOTE_MAX_ROWS,
    oninput: e => { state.val = e.target.value; },
  });
  van.derive(() => {
    const v = state.val;
    // While focused, only accept an update that is a trimmed-down
    // version of what's typed (the card's 4-row limit cutting the
    // overflow); anything else would fight the user's caret.
    if (el.value !== v && (document.activeElement !== el || el.value.startsWith(v))) el.value = v;
  });
  return el;
}

// A number input styled to sit directly on the card (LIFE/PSYCHE/GMP+)
// rather than in the edit dialog: no visible border/background/spinner
// arrows, just plain text the person can click into and type over. The
// .plain-number-input CSS class does the visual stripping; padLength
// (e.g. 4 for "0100") formats the value while unfocused, but shows the
// bare number while the user is actively editing so they aren't
// fighting leading zeros mid-keystroke.
function statNumberInput(state, max, padLength, displayFn) {
  const format = v => {
    const n = clamp(Math.round(Number(v)) || 0, 0, max);
    return padLength ? String(n).padStart(padLength, '0') : String(n);
  };
  const chWidth = String(max).length;
  const el = input({
    type: 'number', min: 0, max, inputmode: 'numeric',
    class: 'plain-number-input',
    style: `width:${chWidth}ch`,
    value: format(displayFn ? displayFn(state.val) : state.val),
    oninput: e => {
      const v = clamp(parseInt(e.target.value, 10) || 0, 0, max);
      state.val = v;
    },
    onfocus: e => {
      // Show the bare number (no padding) while editing, and select it
      // so typing immediately replaces it rather than inserting.
      e.target.value = String(clamp(Math.round(state.val) || 0, 0, max));
      e.target.select();
    },
    onblur: e => { e.target.value = format(displayFn ? displayFn(state.val) : state.val); },
  });
  van.derive(() => {
    const v = displayFn ? displayFn(state.val) : state.val;
    if (document.activeElement !== el) el.value = format(v);
  });
  return el;
}

function textInput(state, placeholder, maxLen) {
  const el = input({
    type: 'text', value: state.val, placeholder: placeholder || '',
    oninput: e => { state.val = e.target.value; },
  });
  if (maxLen) el.maxLength = maxLen;
  van.derive(() => {
    const v = state.val;
    if (document.activeElement !== el && el.value !== v) el.value = v;
  });
  return el;
}

// textInput for the codename: if it's left empty, the default comes back.
function codenameInput(state) {
  const el = textInput(state, DEFAULT_CODENAME, CODENAME_MAX);
  el.addEventListener('blur', () => {
    if (state.val.trim() === '') {
      state.val = DEFAULT_CODENAME;
      el.value = DEFAULT_CODENAME;
    }
  });
  return el;
}

// textInput for Occupation / Role / Pronouns: same shared character budget as
// the fields on the card.
function subtitleInput(state) {
  const el = textInput(state);
  el.addEventListener('input', () => {
    const room = subtitleRoom(state);
    if (el.value.length > room) {
      el.value = el.value.slice(0, room);
      state.val = el.value;
    }
  });
  return el;
}

// ---------- inline contenteditable fields (direct editing on the card) ----------

function pastePlainText(e) {
  e.preventDefault();
  const text = (e.clipboardData || window.clipboardData).getData('text/plain');
  // execCommand is deprecated but remains the simplest cross-browser
  // way to insert plain text into a contenteditable at the caret
  // without pulling in a rich-text editing library.
  document.execCommand('insertText', false, text);
}

// Single-line editable field (codename, class/role/pronouns, skills):
// Enter confirms/blurs rather than inserting a line break, and pasted
// content is flattened to plain text on one line.
function editableInline(tagFn, state, opts = {}) {
  const { extraClass = '', placeholder = '', maxLen = 0, defaultValue = null } = opts;
  // maxLen is a number, or a function returning the current limit (used
  // by the Occupation/Role/Pronouns fields, which share one character budget).
  const limit = () => (typeof maxLen === 'function' ? Math.max(0, maxLen()) : (maxLen || Infinity));
  // Trim to the limit (if any) and keep the caret at the end.
  const enforceMax = node => {
    const max = limit();
    if (node.textContent.length <= max) return;
    node.textContent = node.textContent.slice(0, max);
    const range = document.createRange();
    range.selectNodeContents(node);
    range.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  };
  const el = tagFn({
    class: `editable-text ${extraClass}`.trim(),
    contenteditable: 'true',
    spellcheck: 'false',
    'data-placeholder': placeholder,
    // Block typed characters once full (unless replacing a selection).
    onbeforeinput: e => {
      if (limit() === Infinity || !e.data || e.inputType === 'insertFromPaste') return;
      const sel = window.getSelection();
      const selected = sel && el.contains(sel.anchorNode) ? sel.toString().length : 0;
      if (el.textContent.length - selected + e.data.length > limit()) e.preventDefault();
    },
    oninput: e => { enforceMax(e.currentTarget); state.val = e.currentTarget.textContent; },
    // If the field is left empty and has a defaultValue, put the
    // default back (done on blur so clearing it to retype still works).
    onblur: () => {
      if (defaultValue !== null && state.val.trim() === '') {
        state.val = defaultValue;
        el.textContent = defaultValue;
      }
    },
    onkeydown: e => {
      if (e.key === 'Enter') { e.preventDefault(); e.currentTarget.blur(); }
    },
    onpaste: e => {
      pastePlainText(e);
      // insertText fires its own input event, but normalize afterwards
      // in case a newline slipped through (e.g. via IME/other paths).
      setTimeout(() => {
        const flat = el.textContent.replace(/[\r\n]+/g, ' ');
        if (flat !== el.textContent) el.textContent = flat;
        enforceMax(el);
        state.val = el.textContent;
      }, 0);
    },
  }, state.val);

  // Sync in external changes (from the sidebar dialog, or any other
  // consumer of this state) - but skip while this element has focus,
  // so we never overwrite text the user is actively typing and reset
  // their caret position.
  van.derive(() => {
    const v = state.val;
    if (document.activeElement !== el && el.textContent !== v) el.textContent = v;
  });

  return el;
}

// Editable-text field on the card with a small preset dropdown attached
// (used for the class, role, pronouns, and skill fields - see
// ClassField()/RoleField()/PronounsField()/SkillField()). Clicking
// (really, focusing) the box opens the dropdown; picking a preset fills
// the box and closes it, while typing directly still works exactly as
// before. `key` identifies this field in openPresetDropdown so opening
// one field's dropdown closes any other that's open. `opts.extraClass`
// and `opts.textEl` (an already-built element to wrap, e.g. a skill's
// SkillIcon-paired editableInline) let callers with their own field
// element reuse the same dropdown wiring instead of building a plain one.
function presetField(state, presets, key, placeholder, opts = {}) {
  const el = opts.textEl || editableInline(span, state, { placeholder, extraClass: opts.extraClass, maxLen: opts.maxLen });
  el.addEventListener('focus', () => { openPresetDropdown.val = key; });

  const wrap = span(
    { class: 'class-field-wrap' },
    el,
    div(
      { class: () => 'class-dropdown' + (openPresetDropdown.val === key ? ' open' : '') },
      ...presets.map(preset => button({
        type: 'button',
        class: 'class-dropdown-item',
        onclick: () => {
          // Respect the shared Occupation/Role/Pronouns budget, if this field has one.
          const chosen = typeof opts.maxLen === 'function' ? preset.slice(0, Math.max(0, opts.maxLen())) : preset;
          state.val = chosen;
          // editableInline's own van.derive skips syncing while the box
          // is focused - it just lost focus to this button, so update
          // the visible text directly rather than waiting on that.
          el.textContent = chosen;
          openPresetDropdown.val = null;
        },
      }, preset)),
    ),
  );
  return wrap;
}

function ClassField() {
  return presetField(clsPart, CLASS_PRESETS, 'class', 'Occupation', { maxLen: () => subtitleRoom(clsPart) });
}

function RoleField() {
  return presetField(rolePart, ROLE_PRESETS, 'role', 'Role', { maxLen: () => subtitleRoom(rolePart) });
}

function PronounsField() {
  return presetField(pronounsPart, PRONOUNS_PRESETS, 'pronouns', 'Pronouns', { maxLen: () => subtitleRoom(pronounsPart) });
}

// One skill slot's name field on the card, with the same preset
// dropdown as class/role/pronouns. Each of the 4 skill slots gets its
// own key ('skill-0'..'skill-3') so opening one only closes the others,
// same as any other field.
function SkillField(s, i) {
  const el = editableInline(span, s.name, { extraClass: 'skill-name-text', placeholder: `Skill ${i + 1}`, maxLen: SKILL_NAME_MAX });
  return presetField(s.name, SKILL_PRESETS, `skill-${i}`, `Skill ${i + 1}`, { textEl: el });
}

// Closes any open preset dropdown on a click outside every field - covers
// clicking elsewhere on the card, in the sidebar, or blurring without
// picking a preset. mousedown (not click) so it fires before a new
// focus target steals focus from the field.
document.addEventListener('mousedown', e => {
  if (e.target.closest('.class-field-wrap')) return;
  openPresetDropdown.val = null;
});

// Multi-line editable field (ABOUT ME): Enter is allowed to insert a
// real line break, matching the textarea in the sidebar dialog.
function editableMultiline(tagFn, state, opts = {}) {
  const { extraClass = '', defaultValue = null, maxLen = 0, maxRows = 0 } = opts;
  // Trim to maxLen (if set) and keep the caret at the end.
  const enforceMax = node => {
    if (!maxLen || node.innerText.length <= maxLen) return;
    node.innerText = node.innerText.slice(0, maxLen);
    const range = document.createRange();
    range.selectNodeContents(node);
    range.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  };
  // Number of text rows the content currently wraps onto. Measured with
  // the box temporarily sized to its content (offsetHeight ignores the
  // mobile-scale transform, unlike getBoundingClientRect), so it works
  // however tall the box itself is.
  const countRows = node => {
    const cs = getComputedStyle(node);
    const lh = parseFloat(cs.lineHeight);
    if (!lh) return 0;
    const prev = { flex: node.style.flex, height: node.style.height, overflow: node.style.overflow };
    node.style.flex = 'none';
    node.style.height = 'auto';
    node.style.overflow = 'visible';
    const contentH = node.offsetHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    node.style.flex = prev.flex;
    node.style.height = prev.height;
    node.style.overflow = prev.overflow;
    return Math.round(contentH / lh);
  };
  // Cut characters off the end until the text fits in maxRows rows.
  // Returns true if anything was removed.
  const enforceRows = node => {
    if (!maxRows || countRows(node) <= maxRows) return false;
    let text = node.innerText;
    while (text.length && countRows(node) > maxRows) {
      text = text.slice(0, -1);
      node.innerText = text;
    }
    node.innerText = text.replace(/\s+$/, '');
    const range = document.createRange();
    range.selectNodeContents(node);
    range.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    return true;
  };
  const el = tagFn({
    class: `editable-text ${extraClass}`.trim(),
    contenteditable: 'true',
    spellcheck: 'false',
    // Block typed characters/line breaks once full (unless replacing a
    // selection); pasted text is trimmed in oninput below.
    onbeforeinput: e => {
      if (!maxLen || e.inputType === 'insertFromPaste') return;
      const adds = e.inputType === 'insertParagraph' || e.inputType === 'insertLineBreak' ? 1 : (e.data ? e.data.length : 0);
      if (!adds) return;
      const sel = window.getSelection();
      const selected = sel && el.contains(sel.anchorNode) ? sel.toString().length : 0;
      if (el.innerText.length - selected + adds > maxLen) e.preventDefault();
    },
    oninput: e => { enforceMax(e.currentTarget); enforceRows(e.currentTarget); state.val = e.currentTarget.innerText; },
    onpaste: pastePlainText,
    onfocus: e => {
      // Clicking into the box while it still holds the untouched
      // default/placeholder text clears it immediately, so the first
      // character typed starts a fresh quote instead of being inserted
      // somewhere in the middle of the default sentence (contenteditable
      // has no separate placeholder layer like <input> does - this text
      // is real content, so it has to be cleared explicitly).
      if (defaultValue !== null && state.val === defaultValue) {
        e.currentTarget.innerText = '';
        state.val = '';
      }
    },
  }, state.val);

  van.derive(() => {
    const v = state.val;
    if (document.activeElement !== el && el.innerText !== v) {
      el.innerText = v;
      // Text that arrives from elsewhere (the sidebar field, a loaded
      // card) gets the same row limit; push the trimmed text back so
      // the state and the sidebar field match what the card shows.
      if (enforceRows(el)) queueMicrotask(() => { state.val = el.innerText; });
    }
  });

  return el;
}

// Icon + name pair for one skill slot, in the sidebar editor - mirrors
// the icon input on ParamEditRow below (same maxlength, same plain
// text-or-emoji input) so picking a skill icon works identically to
// picking a parameter icon. Reuses textInput() for both fields, which
// already keeps them in sync with any external state change.
function SkillEditRow(s, i) {
  const iconInput = textInput(s.icon, '⭐');
  iconInput.maxLength = 4;
  iconInput.setAttribute('aria-label', `Skill ${i + 1} icon`);
  const nameInput = textInput(s.name, `Skill ${i + 1}`, SKILL_NAME_MAX);
  nameInput.setAttribute('aria-label', `Skill ${i + 1} name`);
  iconInput.classList.add('skill-icon-input');
  nameInput.classList.add('skill-name-input');
  return div({ class: 'param-edit-row skill-card' },
    div({ class: 'param-name', style: 'display:flex;align-items:center;' },
      span({ class: 'param-name-lbl' }, `Skill ${i + 1}`),
    ),
    iconInput,
    nameInput,
  );
}

function ParamEditRow(p, onRemove) {
  if (p.vacant) {
    return div({ class: 'param-edit-row locked-param' },
      span({ style: 'opacity:0.6;font-size:0.9em;' }, 'Empty slot'),
    );
  }
  const row = div({ class: 'param-edit-row' + (p.locked ? ' locked-param' : '') },
    input({
      type: 'text', value: p.icon.val, maxlength: 4,
      readOnly: p.permanent,
      title: p.permanent ? "This parameter can't be changed" : '',
      oninput: e => { p.icon.val = e.target.value; },
    }),
    (() => {
      const pctInput = input({
        type: 'number', min: 0, max: 100, value: p.percent.val,
        oninput: e => { p.percent.val = clamp(parseInt(e.target.value, 10) || 0, 0, 100); },
      });
      enforceNumberLimit(pctInput, 0, 100);
      return pctInput;
    })(),
    span({ class: 'grade-preview' }, () => {
      // Morale's rank is chosen automatically from its percentage (see
      // MORALE_RANK_IMAGES / moraleRankImage above), so it gets a live
      // image preview here instead of a letter grade.
      if (p.icon.val === MORALE_ICON_EMOJI) {
        return img({ class: 'grade-preview-img', src: moraleRankImage(p.percent.val), alt: '', draggable: 'false' });
      }
      return gradeFor(p.percent.val);
    }),
    () => {
      // Static, uneditable name for whatever icon this row currently
      // holds (e.g. '🚶' -> "Walk"), purely so the person editing the
      // card can tell parameters apart at a glance. Recomputed here
      // since p.icon.val is itself editable text.
      const title = PARAM_ICON_NAMES[p.icon.val] || '';
      return div({ class: 'param-name', style: 'display:flex;align-items:center;' },
        span({ class: 'param-name-lbl' }, title),
      );
    },
  );

  return row;
}

// Builds and owns the list of parameter-editor rows imperatively
// (plain DOM add/remove on explicit user actions) instead of via a
// van reactive binding keyed on paramsList.val. A reactive binding
// here would re-run - rebuilding EVERY row's DOM node from scratch -
// on ANY field change in ANY row, because ParamEditRow() reads each
// row's icon/percent .val synchronously to set initial input
// values; those reads would get captured as dependencies of the same
// binding that maps over the whole list. That's exactly why typing a
// second digit into a parameter box required refocusing: the row
// (and its focused input) was being destroyed and recreated after
// every keystroke. Building rows once and only touching the DOM on
// add/remove avoids that entirely - normal typing never touches this
// container.
let resyncParamsEditor = null;

// One editor row for a sickness column, laid out like a parameter row.
function SicknessEditRow(i) {
  const iconState = sicknessIcons[i];
  const iconInput = input({
    type: 'text', value: iconState.val, maxlength: 8,
    oninput: e => { iconState.val = e.target.value; },
  });
  // Reflect changes made elsewhere (e.g. RESET CARD) while the field isn't focused.
  van.derive(() => {
    const v = iconState.val;
    if (document.activeElement !== iconInput && iconInput.value !== v) iconInput.value = v;
  });
  const valueInput = numberInput(sicknesses[i], 0, 99);
  valueInput.title = '0 = off (hatch pattern), 1-99 = on (red bar filled to that percent)';
  return div({ class: 'param-edit-row' },
    iconInput,
    valueInput,
    span({ class: 'grade-preview' }),
    div({ class: 'param-name', style: 'display:flex;align-items:center;' },
      span({ class: 'param-name-lbl' }, SICKNESS_LABELS[i] || `Sickness ${i + 1}`),
    ),
  );
}

function ParamsEditorSection() {
  const rowsContainer = div({ style: 'display:contents' });
  const rowElByParam = new Map();

  function addRow(p) {
    const rowEl = ParamEditRow(p, () => {
      if (p.permanent) return;
      if (p.locked) {
        // One of the fixed slots (the first five): leave an empty slot
        // in the same position so nothing shifts; a newly added
        // parameter will fill it.
        const vacant = makeParam('', 0, true, false, true);
        paramsList.val = paramsList.val.map(item => item === p ? vacant : item);
        rebuildAll();
        return;
      }
      paramsList.val = paramsList.val.filter(item => item !== p);
      const el = rowElByParam.get(p);
      if (el) { el.remove(); rowElByParam.delete(p); }
    });
    rowElByParam.set(p, rowEl);
    van.add(rowsContainer, rowEl);
  }

  function rebuildAll() {
    rowElByParam.forEach(el => el.remove());
    rowElByParam.clear();
    paramsList.val.forEach(addRow);
  }

  rebuildAll();
  // Exposed so resetCard() can refresh these rows after replacing
  // paramsList.val wholesale. This is only ever called from an
  // explicit user action (the Reset button), never reactively, so it
  // can't reintroduce the per-keystroke rebuild bug this section was
  // rewritten to avoid.
  resyncParamsEditor = rebuildAll;

  return div({},
    // Parameters and sicknesses share one two-column grid (rowsContainer is display:contents, so
    // its rows are grid items; rows added later simply flow into the next free cell).
    // The four sicknesses continue the list right under Morale, as rows like the parameters
    // (editable icon, 0-99 value, name). 0 = off (hatch pattern), 1-99 = red bar at that percent.
    div({ class: 'param-grid' },
      rowsContainer,
      ...sicknesses.map((_, i) => SicknessEditRow(i)),
    ),
  );
}

// need "label" tag
const { label, select, option } = van.tags;

let dropzoneInstance = null;

// Inspects a data-URL image for any actually-transparent pixels (alpha
// < 255 anywhere). PNG/WEBP/GIF can all carry an alpha channel without
// using it, so we check real pixel data rather than trusting the file
// type - a flat-opaque PNG should still get the dark portrait box.
function detectTransparency(dataUrl) {
  return new Promise(resolve => {
    if (!dataUrl) { resolve(false); return; }
    const img = new Image();
    img.onload = () => {
      try {
        const canvas = document.createElement('canvas');
        // Downsample for speed - alpha presence doesn't depend on
        // resolution, and portraits can be large uploaded photos.
        const w = canvas.width = Math.max(1, Math.min(img.naturalWidth || img.width || 1, 200));
        const h = canvas.height = Math.max(1, Math.min(img.naturalHeight || img.height || 1, 200));
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const { data } = ctx.getImageData(0, 0, w, h);
        for (let i = 3; i < data.length; i += 4) {
          if (data[i] < 255) { resolve(true); return; }
        }
        resolve(false);
      } catch (err) {
        // e.g. a tainted canvas - assume opaque rather than failing.
        console.warn('Could not inspect photo for transparency:', err);
        resolve(false);
      }
    };
    img.onerror = () => resolve(false);
    img.src = dataUrl;
  });
}

// Recreates the dot-screen duotone look of the in-game Staff ID
// portraits (sampled from the source video: a warm khaki paper tone
// with dark warm-black ink dots) from an arbitrary uploaded photo.
// Works on a downscaled copy for a consistent, print-like dot pitch
// regardless of the source photo's resolution, and treats each cell's
// average alpha as its own opacity - so a photo that's already a
// transparent cutout stays transparent here too, rather than gaining
// a solid dot grid over empty areas.
const HALFTONE_LIGHT = '#c9c4ab';
const HALFTONE_DARK = '#2b2620';
const HALFTONE_CELL = 6;

function applyHalftoneEffect(dataUrl) {
  return new Promise(resolve => {
    if (!dataUrl) { resolve(null); return; }
    const img = new Image();
    img.onload = () => {
      try {
        const srcW = img.naturalWidth || img.width || 1;
        const srcH = img.naturalHeight || img.height || 1;
        const targetW = 400;
        const targetH = Math.max(1, Math.round(targetW * srcH / srcW));

        const srcCanvas = document.createElement('canvas');
        srcCanvas.width = targetW;
        srcCanvas.height = targetH;
        const srcCtx = srcCanvas.getContext('2d');
        srcCtx.drawImage(img, 0, 0, targetW, targetH);
        const { data } = srcCtx.getImageData(0, 0, targetW, targetH);

        const outCanvas = document.createElement('canvas');
        outCanvas.width = targetW;
        outCanvas.height = targetH;
        const ctx = outCanvas.getContext('2d');

        for (let y = 0; y < targetH; y += HALFTONE_CELL) {
          const ch = Math.min(HALFTONE_CELL, targetH - y);
          for (let x = 0; x < targetW; x += HALFTONE_CELL) {
            const cw = Math.min(HALFTONE_CELL, targetW - x);
            let lumSum = 0, alphaSum = 0, count = 0;
            for (let cy = 0; cy < ch; cy++) {
              for (let cx = 0; cx < cw; cx++) {
                const i = ((y + cy) * targetW + (x + cx)) * 4;
                const a = data[i + 3];
                lumSum += (0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]) * (a / 255);
                alphaSum += a;
                count++;
              }
            }
            const avgAlpha = alphaSum / count / 255;
            if (avgAlpha < 0.03) continue;
            const avgLum = lumSum / count;

            ctx.globalAlpha = avgAlpha;
            ctx.fillStyle = HALFTONE_LIGHT;
            ctx.fillRect(x, y, cw, ch);

            // Darker source pixels get a bigger ink dot, exactly like a
            // real halftone printing screen - a small overlap allowance
            // at full black lets shadows read as solid rather than
            // capping out at visibly separated dots.
            const darkness = 1 - (avgLum / 255);
            const maxRadius = (HALFTONE_CELL / 2) * 1.15;
            const radius = maxRadius * Math.sqrt(darkness);
            if (radius > 0.15) {
              ctx.fillStyle = HALFTONE_DARK;
              ctx.beginPath();
              ctx.arc(x + cw / 2, y + ch / 2, radius, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        }
        ctx.globalAlpha = 1;
        resolve(outCanvas.toDataURL('image/png'));
      } catch (err) {
        // e.g. a tainted canvas - fall back to the unprocessed photo
        // rather than losing the portrait entirely.
        console.warn('Halftone processing failed, using original photo:', err);
        resolve(dataUrl);
      }
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

// Single entry point for setting the portrait photo, so transparency
// detection always runs and every caller (dropzone, drag-and-drop,
// restored-from-storage) stays consistent.
// Recomputes profileImgDisplay from the current raw profileImg and the
// halftoneEnabled toggle - called both when the photo itself changes
// and when the toggle changes, so switching the setting takes effect
// immediately on whatever photo is already loaded, not just future
// uploads.
function refreshProfileDisplay() {
  const raw = profileImg.val;
  if (!raw) { profileImgDisplay.val = null; return; }
  if (!halftoneEnabled.val) { profileImgDisplay.val = raw; return; }
  applyHalftoneEffect(raw).then(processedUrl => {
    // Guard against staleness: only apply if this is still the current
    // photo and the toggle hasn't been flipped back off while this was
    // processing.
    if (profileImg.val === raw && halftoneEnabled.val) profileImgDisplay.val = processedUrl;
  });
}

function setProfileImage(dataUrl) {
  profileImg.val = dataUrl || null;
  if (!dataUrl) {
    profileImgDisplay.val = null;
    portraitHasTransparency.val = false;
    return;
  }
  detectTransparency(dataUrl).then(hasAlpha => {
    // Guard against a stale result if the photo changed again while
    // this was still being inspected.
    if (profileImg.val === dataUrl) portraitHasTransparency.val = hasAlpha;
  });
  refreshProfileDisplay();
}

// Single entry point for removing the portrait photo - always restores
// the dark photo box alongside clearing the image itself.
function clearProfileImage() {
  setProfileImage(null);
}

// Hidden <input type=file> behind the portrait box. Clicking the portrait
// opens the device's file/photo picker (photo library, camera roll, or
// file storage depending on the platform); the chosen image goes through
// the same loadImageFile() path as drag-and-drop and the editor dropzone.
let portraitFileInput = null;
function openPortraitPicker() {
  if (!portraitFileInput) {
    portraitFileInput = document.createElement('input');
    portraitFileInput.type = 'file';
    portraitFileInput.accept = 'image/*';
    portraitFileInput.style.display = 'none';
    portraitFileInput.addEventListener('change', () => {
      const file = portraitFileInput.files && portraitFileInput.files[0];
      loadImageFile(file);
      // Clear so picking the same file again still fires 'change'.
      portraitFileInput.value = '';
    });
    document.body.appendChild(portraitFileInput);
  }
  portraitFileInput.click();
}

// Shared by the sidebar dropzone widget and drag-and-drop directly
// onto the card's portrait. Routing through dropzoneInstance.addFile
// (when it's available) keeps both UIs in sync - the editor dialog's
// thumbnail preview will show whatever was dropped on the card, and
// vice versa. Falls back to a plain FileReader for the brief window
// before the dropzone widget has initialized.
function loadImageFile(file) {
  if (!file || !file.type || !file.type.startsWith('image/')) return;
  if (dropzoneInstance) {
    dropzoneInstance.addFile(file);
  } else {
    const reader = new FileReader();
    reader.onload = e => { openCropper(e.target.result, file.type, setProfileImage, null); };
    reader.readAsDataURL(file);
  }
}


// ---------- profile image cropper ----------
// Opens a modal showing the chosen image with a fixed 1:1 (square)
// crop box that can be dragged to move and resized from its corners.
// Calls onDone(croppedDataUrl) on confirm, onCancel() otherwise. The
// output is the selected region only, scaled to at most 800x800, so the
// card shows exactly what was framed here.
const CROP_ASPECT = 309 / 333; // matches the profile box (309px wide x 333px tall) so a cropped photo isn't squashed
const CROP_OUT_W = 800;
const CROP_OUT_H = 800;
function openCropper(dataUrl, mimeType, onDone, onCancel) {
  const imgEl = new Image();
  imgEl.onerror = () => { if (onCancel) onCancel(); };
  imgEl.onload = () => {
    const natW = imgEl.naturalWidth, natH = imgEl.naturalHeight;
    if (!natW || !natH) { if (onCancel) onCancel(); return; }

    // Fit the image inside the viewport (minus dialog chrome).
    const maxW = Math.max(160, Math.min(window.innerWidth - 56, 900));
    const maxH = Math.max(160, window.innerHeight - 190);
    const scale = Math.min(maxW / natW, maxH / natH, 1);
    const dispW = Math.round(natW * scale), dispH = Math.round(natH * scale);
    imgEl.width = dispW; imgEl.height = dispH;

    const overlay = document.createElement('div');
    overlay.className = 'crop-overlay';
    const dialog = document.createElement('div');
    dialog.className = 'crop-dialog';
    const title = document.createElement('div');
    title.className = 'crop-title';
    title.textContent = 'Crop Profile Image For Membership Card';
    const hint = document.createElement('div');
    hint.className = 'crop-hint';
    hint.textContent = 'Drag the box to move it. Drag a corner to resize.';
    const stage = document.createElement('div');
    stage.className = 'crop-stage';
    stage.style.width = dispW + 'px';
    stage.style.height = dispH + 'px';
    stage.appendChild(imgEl);
    const box = document.createElement('div');
    box.className = 'crop-box';
    ['nw', 'ne', 'sw', 'se'].forEach(c => {
      const h = document.createElement('div');
      h.className = 'crop-handle ' + c;
      h.dataset.corner = c;
      box.appendChild(h);
    });
    stage.appendChild(box);
    const actions = document.createElement('div');
    actions.className = 'crop-actions';
    const cancelBtn = document.createElement('button');
    cancelBtn.type = 'button'; cancelBtn.textContent = 'Cancel';
    const okBtn = document.createElement('button');
    okBtn.type = 'button'; okBtn.className = 'primary'; okBtn.textContent = 'Use Crop';
    actions.append(cancelBtn, okBtn);
    dialog.append(title, hint, stage, actions);
    overlay.appendChild(dialog);
    document.body.appendChild(overlay);

    // Crop rect in displayed pixels, always w:h = 1:1.
    let w = Math.min(dispW, dispH * CROP_ASPECT);
    let h = w / CROP_ASPECT;
    let x = (dispW - w) / 2, y = (dispH - h) / 2;
    const minW = Math.min(40, dispW, dispH * CROP_ASPECT);
    function render() {
      box.style.left = x + 'px'; box.style.top = y + 'px';
      box.style.width = w + 'px'; box.style.height = h + 'px';
    }
    render();

    let drag = null;
    box.addEventListener('pointerdown', e => {
      e.preventDefault();
      box.setPointerCapture(e.pointerId);
      const corner = e.target.dataset && e.target.dataset.corner;
      drag = { id: e.pointerId, corner: corner || null, sx: e.clientX, sy: e.clientY, x, y, w, h };
    });
    box.addEventListener('pointermove', e => {
      if (!drag || e.pointerId !== drag.id) return;
      const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
      if (!drag.corner) {
        x = Math.max(0, Math.min(dispW - w, drag.x + dx));
        y = Math.max(0, Math.min(dispH - h, drag.y + dy));
      } else {
        // Anchor the opposite corner; width follows the pointer and
        // height is derived so the box stays 1:1.
        const c = drag.corner;
        const ax = c.includes('w') ? drag.x + drag.w : drag.x;
        const ay = c.includes('n') ? drag.y + drag.h : drag.y;
        const rawW = c.includes('w') ? (drag.x + drag.w) - (drag.x + dx) : drag.w + dx;
        const rawH = c.includes('n') ? (drag.y + drag.h) - (drag.y + dy) : drag.h + dy;
        let nw = Math.max(rawW, rawH * CROP_ASPECT);
        const maxWx = c.includes('w') ? ax : dispW - ax;
        const maxHy = c.includes('n') ? ay : dispH - ay;
        nw = Math.min(nw, maxWx, maxHy * CROP_ASPECT);
        nw = Math.max(nw, minW);
        w = nw; h = nw / CROP_ASPECT;
        x = c.includes('w') ? ax - w : ax;
        y = c.includes('n') ? ay - h : ay;
      }
      render();
    });
    const endDrag = e => { if (drag && e.pointerId === drag.id) drag = null; };
    box.addEventListener('pointerup', endDrag);
    box.addEventListener('pointercancel', endDrag);

    function close() {
      document.removeEventListener('keydown', onKey);
      overlay.remove();
    }
    function onKey(e) { if (e.key === 'Escape') cancel(); }
    function cancel() { close(); if (onCancel) onCancel(); }
    document.addEventListener('keydown', onKey);
    cancelBtn.addEventListener('click', cancel);
    okBtn.addEventListener('click', () => {
      const k = natW / dispW;
      const sx = x * k, sy = y * k, sw = w * k, sh = w / CROP_ASPECT * k;
      const outScale = Math.min(1, CROP_OUT_W / sw, CROP_OUT_H / sh);
      const canvasEl = document.createElement('canvas');
      canvasEl.width = Math.max(1, Math.round(sw * outScale));
      canvasEl.height = Math.max(1, Math.round(sh * outScale));
      const ctx = canvasEl.getContext('2d');
      ctx.drawImage(imgEl, sx, sy, sw, sh, 0, 0, canvasEl.width, canvasEl.height);
      // Keep transparency for formats that can carry it; JPEG otherwise
      // to keep the saved card small.
      const keepAlpha = /png|webp|gif|svg/i.test(mimeType || '');
      let out;
      try { out = keepAlpha ? canvasEl.toDataURL('image/png') : canvasEl.toDataURL('image/jpeg', 0.92); }
      catch (err) { console.warn('Could not crop image:', err); close(); if (onCancel) onCancel(); return; }
      close();
      onDone(out);
    });
  };
  imgEl.src = dataUrl;
}

function setupDropzone(container) {
  const dz = new Dropzone(container, {
    url: '#',
    autoProcessQueue: false,
    maxFiles: 1,
    acceptedFiles: 'image/*',
    addRemoveLinks: true,
    dictDefaultMessage: 'Drop a profile photo here or click to upload',
  });
  // Set while this code removes files from the widget itself, so the
  // 'removedfile' handler doesn't mistake that for the user clearing the
  // photo (which would wipe the card's current image).
  let dzInternalRemove = false;
  function dzRemove(f) {
    dzInternalRemove = true;
    try { dz.removeFile(f); } finally { dzInternalRemove = false; }
  }
  dz.on('addedfile', file => {
    const reader = new FileReader();
    reader.onload = e => {
      openCropper(e.target.result, file.type,
        cropped => {
          // Confirmed: drop any older file from the widget, keep this one.
          dz.files.slice().forEach(f => { if (f !== file) dzRemove(f); });
          setProfileImage(cropped);
        },
        () => {
          // Cancelled: leave the existing photo untouched.
          dzRemove(file);
        });
    };
    reader.readAsDataURL(file);
  });
  dz.on('removedfile', () => {
    if (dzInternalRemove) return;
    if (dz.files.length === 0) clearProfileImage();
  });
  dropzoneInstance = dz;
  return dz;
}

// ---------- reset ----------

function resetCard() {
  const confirmed = window.confirm(
    'Reset this card to its default template? This clears every field, including your saved data, and cannot be undone.'
  );
  if (!confirmed) return;

  codename.val = DEFAULT_CODENAME;
  clsPart.val = DEFAULT_CLASS;
  rolePart.val = DEFAULT_ROLE;
  pronounsPart.val = DEFAULT_PRONOUNS;
  life.val = DEFAULT_LIFE;
  psyche.val = DEFAULT_PSYCHE;
  gmp.val = DEFAULT_GMP;
  quote.val = DEFAULT_QUOTE;
  ticker.val = DEFAULT_TICKER;
  DEFAULT_SKILLS.forEach((v, i) => {
    if (!skills[i]) return;
    skills[i].icon.val = v.icon;
    skills[i].name.val = v.name;
  });

  // Replace the parameter list wholesale (restores the original count
  // even if rows were added/removed), then explicitly refresh the
  // dialog's imperatively-managed rows to match - they don't watch
  // paramsList reactively (see ParamsEditorSection), so without this
  // they'd keep showing the old, now-orphaned parameter objects.
  paramsList.val = createDefaultParams();
  if (resyncParamsEditor) resyncParamsEditor();
  pixelIconMode.val = true;
  DEFAULT_SICKNESS_ICONS.forEach((v, i) => {
    if (sicknessIcons[i]) sicknessIcons[i].val = v;
  });
  DEFAULT_SICKNESSES.forEach((v, i) => {
    if (sicknesses[i]) sicknesses[i].val = v;
  });

  clearProfileImage();
  halftoneEnabled.val = false;
  overlayChoice.val = 'default';
  khakiEnabled.val = true;
  if (dropzoneInstance) {
    try { dropzoneInstance.removeAllFiles(true); } catch (err) { /* no files to remove */ }
  }

  try { localStorage.removeItem(STORAGE_KEY); } catch (err) { /* ignore */ }
}

// ---------- PNG export ----------

function safeFileName(name) {
  const cleaned = String(name || '').trim().replace(/[^a-z0-9_\- ]+/gi, '').trim().replace(/\s+/g, '_');
  return cleaned || 'card';
}

// A skill slot is "untouched" for export purposes if its name is
// either blank or still exactly the seeded default text (currently
// only slot 1 ships with a non-empty default, "Skill Name 1", but
// this checks every slot against its own DEFAULT_SKILLS entry so it
// keeps working if that ever changes). For an untouched slot, both
// the name text (real text or the empty-state "Skill N" placeholder)
// and the icon (emoji or pixel-art) get hidden - but only in the
// exported PNG; the live card keeps showing them so the user still
// knows those slots are editable.
function markUntouchedSkillsForExport(hide) {
  const nameEls = document.querySelectorAll('.skill-name-text');
  const iconEls = document.querySelectorAll('.skill-icon-el');
  nameEls.forEach((el, i) => {
    const current = skills[i] ? skills[i].name.val : '';
    const defaultVal = DEFAULT_SKILLS[i] ? DEFAULT_SKILLS[i].name : '';
    const untouched = current.trim() === '' || current === defaultVal;
    el.classList.toggle('export-hide-text', hide && untouched);
    if (iconEls[i]) iconEls[i].classList.toggle('export-hide-text', hide && untouched);
  });
}

// Same idea as markUntouchedSkillsForExport, for the ABOUT ME
// description box: its placeholder/default text is hidden in the
// exported PNG whenever it's blank or still exactly the seeded
// default text, but the box itself (dark background/frame) stays
// visible either way - only the text color is toggled, not the whole
// element - and the live card is left untouched so the user can still
// see (and click into) it.
function markUntouchedQuoteForExport(hide) {
  const el = document.querySelector('.quote-box');
  if (!el) return;
  const untouched = quote.val.trim() === '' || quote.val === DEFAULT_QUOTE;
  el.classList.toggle('export-hide-quote-text', hide && untouched);
}

async function downloadCardPng(triggerBtn) {
  const cardEl = document.querySelector('.paper');
  if (!cardEl || typeof modernScreenshot === 'undefined') {
    console.error('modern-screenshot not available or .paper not found');
    return;
  }
  if (triggerBtn) triggerBtn.disabled = true;
  markUntouchedSkillsForExport(true);
  markUntouchedQuoteForExport(true);
  drawAllSickHatches();
  // The scrolling ticker tape is a animated UI overlay, not
  // part of the card - Its hidden for the
  // capture (restored in the finally block either way) rather than
  // freezing it mid-scroll into the exported image.
  const tickerEl = document.querySelector('.ticker-tape');
  const prevTickerDisplay = tickerEl ? tickerEl.style.display : null;
  if (tickerEl) tickerEl.style.display = 'none';
  // If applyMobileScale() has shrunk .paper with a CSS transform (see
  // near the bottom of this file), undo that just for the capture -
  // the screenshot should render the card at its real, full 1280px design
  // resolution regardless of how small the phone screen it's being
  // exported from is. Restored in the finally block either way.
  const hadTransform = !!cardEl.style.transform;
  const prevTransform = cardEl.style.transform;
  const prevWidth = cardEl.style.width;
  const prevMaxWidth = cardEl.style.maxWidth;
  if (hadTransform) {
    cardEl.style.transform = '';
    cardEl.style.width = '1280px';
    cardEl.style.maxWidth = 'none';
  }
  try {
    const canvas = await modernScreenshot.domToCanvas(cardEl, {
      scale: 2,
      // The LIFE/PSYCHE/GMP+ values are <input type="number">, and the
      // ::-webkit-inner-spin-button rule that hides their spinner isn't
      // carried into the screenshot's clone (only computed styles are),
      // so the spinner would eat width and clip the last digit. Plain
      // text inputs have no spinner; only the clone is changed.
      onCloneEachNode: (node) => {
        if (node instanceof HTMLInputElement && node.type === 'number') node.type = 'text';
      },
    });
    const dataUrl = canvas.toDataURL('image/png');
    const link = document.createElement('a');
    link.download = `${safeFileName(codename.val)}.png`;
    link.href = dataUrl;
    document.body.appendChild(link);
    link.click();
    link.remove();
  } catch (err) {
    console.error('Failed to export card as PNG:', err);
  } finally {
    markUntouchedSkillsForExport(false);
    markUntouchedQuoteForExport(false);
    if (tickerEl) tickerEl.style.display = prevTickerDisplay;
    if (hadTransform) {
      cardEl.style.transform = prevTransform;
      cardEl.style.width = prevWidth;
      cardEl.style.maxWidth = prevMaxWidth;
    }
    if (triggerBtn) triggerBtn.disabled = false;
  }
}

  const btn = button({

function EditorUI() {
  // Build the overlay + dialog exactly once. Toggling `dialogOpen`
  // must never recreate these nodes - Dialog() reads many fields'
  // .val synchronously while building the form (to set each input's
  // initial value), so if it were rebuilt inside a reactive binding
  // that also depends on those fields, every keystroke in any field
  // would tear down and rebuild the whole dialog, killing focus.
  // Instead we mount it once and only flip a `display` style, which
  // is a leaf-level binding depending on dialogOpen alone.
  const modalWrap = div(
    {
      class: 'editor-modal-wrap',
      style: () => dialogOpen.val ? '' : 'display:none;',
    },
    div({ class: 'editor-overlay', onclick: () => { dialogOpen.val = false; } }),
    Dialog(),
  );

  return div({},
    button({
      class: 'hamburger-btn',
      'aria-label': 'Edit card',
      onclick: () => { dialogOpen.val = true; },
    }, span({}), span({}), span({})),
    DownloadButton(),
    DiscordButton(),
    InstagramButton(),
    modalWrap,
  );
}

// ---------- mount ----------
// NOTE: Card() and EditorUI() are mounted as plain (already-built) DOM
// nodes, not as `() => Card()` / `() => EditorUI()` reactive wrappers.
// Both functions already do their fine-grained reactive binding
// internally (every dynamic bit is a nested `() => state.val` child or
// prop, which VanJS binds in isolation). Wrapping the whole call in a
// function here would instead make VanJS treat *every* van.state read
// anywhere during that single build as a dependency of the entire
// returned subtree - so e.g. typing into the codename field would
// destroy and recreate the whole editor dialog (and any focused
// input inside it) on every keystroke.
// The sicknesses row's diagonal hatch pattern is drawn on plain
// <canvas> elements rather than via a CSS repeating-linear-gradient
// background. html2canvas's gradient renderer is unreliable across
// versions/edge-cases (custom-property backgrounds, "hard" color
// stops at identical positions, etc.) and the hatch kept exporting
// blank no matter how the gradient CSS was written. Copying pixels
// from a live <canvas> element, by contrast, is one of html2canvas's
// most solid, well-tested code paths, so we draw the pattern
// ourselves once with the 2D canvas API and let html2canvas just
// copy the bitmap as-is.
function drawSickHatch(canvasEl) {
  // Size from the always-visible parent cell (clientWidth/Height), not
  // from the canvas itself: the canvas is display:none whenever the
  // sickness has a value, and a hidden element reports 0x0 - which used
  // to leave a 1x1 bitmap that stretched into a solid black cell the
  // next time the value dropped back to zero. clientWidth/Height also
  // ignore the mobile-scale transform, unlike getBoundingClientRect().
  const parent = canvasEl.parentElement;
  const w = parent ? Math.round(parent.clientWidth) : 0;
  const h = parent ? Math.round(parent.clientHeight) : 0;
  if (w < 2 || h < 2) return; // not laid out yet - a later redraw will handle it
  // Oversample well beyond typical device pixel ratios so the stripes
  // stay crisp even under html2canvas's own `scale: 2` export option.
  const scaleFactor = Math.max(2, window.devicePixelRatio || 1) * 2;
  canvasEl.width = w * scaleFactor;
  canvasEl.height = h * scaleFactor;
  const ctx = canvasEl.getContext('2d');
  ctx.setTransform(scaleFactor, 0, 0, scaleFactor, 0, 0);
  ctx.clearRect(0, 0, w, h);
  // Re-measured against the in-game SICKNESSES panel: slightly darker
  // khaki base, 2px near-black lines running "/" (bottom-left to
  // top-right) with 8px vertical pitch (= ~5.66px perpendicular).
  ctx.fillStyle = `rgba(179, 179, 155, ${khakiEnabled.val ? 1 : 0})`; // khaki base follows the khaki toggle
  ctx.fillRect(0, 0, w, h);
  ctx.save();
  ctx.translate(w / 2, h / 2);
  ctx.rotate(-Math.PI / 4);
  const diag = Math.sqrt(w * w + h * h);
  ctx.fillStyle = '#1a1a12';
  for (let y = -diag; y < diag; y += 5.66) {
    ctx.fillRect(-diag, y, diag * 2, 2);
  }
  ctx.restore();
}

function drawAllSickHatches() {
  document.querySelectorAll('canvas.sick-cell-hatch').forEach(drawSickHatch);
}

window.addEventListener('resize', drawAllSickHatches);
// Repaint the hatch cells' khaki base whenever the toggle changes.
van.derive(() => { khakiEnabled.val; requestAnimationFrame(drawAllSickHatches); });

// ---------- mobile scaling ----------
// .paper is a fixed 1280px-wide design (grid columns, em-based font
// sizes, absolute-ish positioning all tuned to that width). Letting it
// simply reflow into a narrow phone viewport via max-width:100% (as it
// does on desktop/tablet) squashes that layout rather than shrinking
// it proportionally - text wraps oddly, columns collide, tap targets
// overlap. Below MOBILE_BREAKPOINT, applyMobileScale() instead renders
// .paper at its full natural 1280px width (so every desktop proportion
// is preserved exactly) and visually scales the whole thing down with
// a CSS transform, like zooming out evenly - identical UI, just
// smaller. .paper-scale-wrap is then given a matching height so the
// page doesn't leave blank space where the unscaled layout used to be.
// Desktop is entirely unaffected: above the breakpoint every inline
// style this sets is cleared, leaving the original CSS (width:1280px;
// max-width:100%; aspect-ratio) in full control, exactly as before.
function applyMobileScale() {
  const paperEl = document.querySelector('.paper');
  const wrapEl = document.querySelector('.paper-scale-wrap');
  if (!paperEl || !wrapEl) return;

  // Always fit: render .paper at its natural 1280px design width and scale the
  // whole card (up or down) so it is as large as possible inside the window
  // without being cropped, centred on the black page background.
  const naturalWidth = 1280;
  const naturalHeight = paperEl.offsetHeight || (naturalWidth / 1.75); // offsetHeight ignores the transform
  const vw = Math.max(1, window.innerWidth);
  const vh = Math.max(1, window.innerHeight);
  // On small screens the icon buttons are stacked down the right edge (see CSS); keep the card
  // out of that strip so the buttons never sit on top of it.
  let reserved = 0;
  if (window.innerWidth <= 950) {
    const btn = document.querySelector('.hamburger-btn');
    const left = btn ? btn.getBoundingClientRect().left : 0;
    reserved = left > 0 ? (vw - left + 8) : 60;
  }
  const availW = Math.max(1, vw - reserved);
  const scale = Math.min(availW / naturalWidth, vh / naturalHeight);
  const w = naturalWidth * scale;
  const h = naturalHeight * scale;
  paperEl.style.width = `${naturalWidth}px`;
  paperEl.style.maxWidth = 'none';
  paperEl.style.transformOrigin = 'top left';
  paperEl.style.transform = `scale(${scale})`;
  wrapEl.style.width = `${w}px`;
  wrapEl.style.height = `${h}px`;
  wrapEl.style.left = `${(availW - w) / 2}px`;
  wrapEl.style.top = `${(vh - h) / 2}px`;
}

window.addEventListener('resize', applyMobileScale);
window.addEventListener('orientationchange', applyMobileScale);

const app = document.getElementById('app');
van.add(app, div({ class: 'paper-scale-wrap' }, Card()));
van.add(app, EditorUI());
// Draw after layout has actually settled (fonts, flex sizing) rather
// than immediately on append, when getBoundingClientRect() could
// still report stale/zero sizes. Same reasoning applies to the mobile
// scale calculation, which also depends on .paper's settled size.
requestAnimationFrame(() => requestAnimationFrame(() => {
  drawAllSickHatches();
  applyMobileScale();
}));

</script>

</body>
</html>
