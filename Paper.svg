<svg
  xmlns="http://www.w3.org/2000/svg"
  width="100%"
  height="100%"
  viewBox="0 0 1200 800"
  preserveAspectRatio="none"
 xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Large soft cloudy mottling: lighter and darker khaki patches,
         like the in-game Staff ID paper (lighter toward the right edge,
         slightly darker/greener in blotches). -->
    <filter id="mottle" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0045 0.006" numOctaves="3" seed="23" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.12
                0 0 0 0 0.12
                0 0 0 0 0.08
                1.1 0 0 0 -0.42"/>
    </filter>
    <filter id="mottleLight" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0065 0.0085" numOctaves="2" seed="71" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.98
                0 0 0 0 0.98
                0 0 0 0 0.88
                0 1.0 0 0 -0.43"/>
    </filter>

    <!-- Fine film/print grain -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="5" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.20
                0 0 0 0 0.20
                0 0 0 0 0.14
                0 0 0 1.0 -0.48"/>
    </filter>

    <!-- Gentle vignette: edges and corners a touch darker, centre-right
         a touch lighter, as in the game screenshot. -->
    <radialGradient id="vig" cx="62%" cy="42%" r="80%">
      <stop offset="0"    stop-color="#d4d4bc" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#d4d4bc" stop-opacity="0"/>
      <stop offset="1"    stop-color="#6f6f58" stop-opacity="0.30"/>
    </radialGradient>
  </defs>

  <!-- Base: khaki paper sampled from the screenshot (#b8b8a0) -->
  <rect width="1200" height="800" fill="#b8b8a0"/>

  <!-- Cloudy tonal variation -->
  <rect width="1200" height="800" fill="#000" filter="url(#mottle)" opacity="0.28"/>
  <rect width="1200" height="800" fill="#000" filter="url(#mottleLight)" opacity="0.38"/>

  <!-- Vignette -->
  <rect width="1200" height="800" fill="url(#vig)"/>

  <!-- Grain on top -->
  <rect width="1200" height="800" fill="#000" filter="url(#grain)" opacity="0.5"/>
</svg>
