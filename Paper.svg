<svg
  xmlns="http://www.w3.org/2000/svg"
  width="100%"
  height="100%"
  viewBox="0 0 1200 800"
  preserveAspectRatio="none"
>
  <defs>
    <!-- Fine paper grain -->
    <filter id="paperTexture" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.75"
        numOctaves="4"
        seed="17"
        stitchTiles="stitch"
        result="noise"
      />

      <!-- Turn the noise into subtle warm gray variation -->
      <feColorMatrix
        in="noise"
        type="matrix"
        values="
          0.18 0 0 0 0.72
          0 0.16 0 0 0.69
          0 0 0.13 0 0.61
          0 0 0 0.20 0
        "
        result="grain"
      />

      <!-- Soften the grain -->
      <feGaussianBlur
        in="grain"
        stdDeviation="0.15"
        result="softGrain"
      />

      <feBlend
        in="SourceGraphic"
        in2="softGrain"
        mode="multiply"
      />
    </filter>

    <!-- Very subtle larger-scale variation -->
    <filter id="paperVariation">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.018"
        numOctaves="2"
        seed="42"
        result="variation"
      />

      <feColorMatrix
        in="variation"
        type="saturate"
        values="0"
        result="grayVariation"
      />

      <feComponentTransfer>
        <feFuncA type="linear" slope="0.08" />
      </feComponentTransfer>

      <feBlend
        in="SourceGraphic"
        in2="grayVariation"
        mode="multiply"
      />
    </filter>
  </defs>

  <!-- Warm paper -->
  <rect
    width="100%"
    height="100%"
    fill="#f4f0e6"
    filter="url(#paperVariation)"
  />

  <!-- Fine fibers/grain -->
  <rect
    width="100%"
    height="100%"
    fill="#f4f0e6"
    filter="url(#paperTexture)"
    opacity="0.55"
  />
</svg>
